<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Echo Dungeon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: manipulation;
        }
        
        #game {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #micButton {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #222;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
            z-index: 10;
        }

        #micButton:active {
            background: #444;
        }

        .listening {
            background: #00FF00 !important;
        }

        .start-button {
            background: #000044 !important;
        }
    </style>
</head>

    <div id="game"></div>

        // ------------------------------------------------------------
        // SECTION 6: ATTRIBUTE CALCULATIONS
        // ------------------------------------------------------------
        
        function calculateDerivedStats() {
            const p = game.player;
            
            // Dexterity: 1% crit per point, max 50%
            p.critChance = Math.min(50, p.dexterity);
            
            // Dexterity: 0.5% dodge per point, max 25%
            p.dodgeChance = Math.min(25, p.dexterity * 0.5);
            
            // Halfling racial: +15% dodge
            if (p.race === 'halfling') {
                p.dodgeChance = Math.min(40, p.dodgeChance + 15);
            }
            
            // Strength: +5 max health per point above 10
            const strengthBonus = (p.strength - 10) * 5;
            
            // Wisdom: +5 max mana per point above 10
            const wisdomBonus = (p.wisdom - 10) * 5;
            
            // Apply to max stats
            const classData = classes[p.class];
            if (classData) {
                p.maxHealth = classData.maxHealth + strengthBonus + ((p.level - 1) * 10);
                p.maxMana = classData.maxMana + wisdomBonus + ((p.level - 1) * 5);
            }
            
            // Cap current values
            if (p.health > p.maxHealth) p.health = p.maxHealth;
            if (p.mana > p.maxMana) p.mana = p.maxMana;
        }

        // ------------------------------------------------------------
        // SECTION 7: DAMAGE CALCULATIONS
        // ------------------------------------------------------------
        
        function calculateAttackDamage() {
            const p = game.player;
            let damage = p.baseAttack;
            
            // Strength bonus
            if (p.class === 'warrior') {
                damage += p.strength * 2;
            } else {
                damage += p.strength;
            }
            
            // Rogues get bonus from DEX
            if (p.class === 'rogue') {
                damage += Math.floor(p.dexterity * 0.5);
            }
            
            // Level bonus
            damage += (p.level - 1) * 3;
            
            // Apply floor multiplier
            damage = Math.floor(damage * p.damageMultiplier);
            
            return damage;
        }

        // ------------------------------------------------------------
        // SECTION 8: SPELL DAMAGE CALCULATIONS
        // ------------------------------------------------------------
        
        function calculateSpellDamage(baseSpellDamage) {
            const p = game.player;
            const wisdomMultiplier = 1 + (p.wisdom * 0.03);
            return Math.floor(baseSpellDamage * wisdomMultiplier * p.damageMultiplier);
        }

        // ------------------------------------------------------------
        // SECTION 9: MANA COST REDUCTION
        // ------------------------------------------------------------
        
        function getManaCostReduction() {
            const p = game.player;
            return Math.min(50, p.wisdom * 0.5);
        }

        function adjustManaCost(baseCost) {
            const reduction = getManaCostReduction();
            const adjusted = Math.floor(baseCost * (1 - reduction / 100));
            return Math.max(1, Math.floor(adjusted / game.player.manaMultiplier));
        }

        // ------------------------------------------------------------
        // SECTION 10: ATTRIBUTE POINT ALLOCATION
        // ------------------------------------------------------------
        
        function allocateAttributePoint(attribute) {
            const p = game.player;
            
            if (p.unspentAttributePoints <= 0) {
                speak('You have no attribute points to spend. You gain 3 points each time you level up.');
                return false;
            }
            
            if (attribute === 'strength') {
                p.strength++;
                p.unspentAttributePoints--;
                calculateDerivedStats();
                speak(`Wonderful! Strength increased to ${p.strength}. Your maximum health is now ${p.maxHealth}. You have ${p.unspentAttributePoints} points remaining.`);
            } else if (attribute === 'dexterity') {
                p.dexterity++;
                p.unspentAttributePoints--;
                calculateDerivedStats();
                speak(`Excellent! Dexterity increased to ${p.dexterity}. Your critical hit chance is ${p.critChance}% and dodge chance is ${p.dodgeChance}%. You have ${p.unspentAttributePoints} points remaining.`);
            } else if (attribute === 'wisdom') {
                p.wisdom++;
                p.unspentAttributePoints--;
                calculateDerivedStats();
                const reduction = getManaCostReduction();
                speak(`Splendid! Wisdom increased to ${p.wisdom}. Your maximum mana is now ${p.maxMana} and spell costs are reduced by ${reduction.toFixed(0)}%. You have ${p.unspentAttributePoints} points remaining.`);
            } else {
                speak('Please say strength, dexterity, or wisdom to allocate a point.');
                return false;
            }
            
            return true;
        }

        // ------------------------------------------------------------
        // SECTION 11: CRITICAL HIT CHECK
        // ------------------------------------------------------------
        
        function rollCriticalHit() {
            const roll = Math.random() * 100;
            return roll < game.player.critChance;
        }

        // ------------------------------------------------------------
        // SECTION 12: DODGE CHECK
        // ------------------------------------------------------------
        
        function rollDodge() {
            const roll = Math.random() * 100;
            return roll < game.player.dodgeChance;
        }

        // ------------------------------------------------------------
        // SECTION 13: FLOOR MULTIPLIER UPDATES
        // ------------------------------------------------------------
        
        function updateFloorMultipliers() {
            const floor = game.dungeon.currentLevel;
            
            if (floor % 10 === 0) {
                game.player.damageMultiplier *= 1.5;
                game.player.defenseMultiplier *= 1.5;
                game.player.manaMultiplier *= 1.25;
                
                speak(`Congratulations on reaching floor ${floor}! You feel a surge of power flowing through you. Your damage and defense have been greatly increased!`);
            }
        }

        // ------------------------------------------------------------
        // SECTION 14: TEXT-TO-SPEECH ENGINE
        // Polite, cheery, respectful speech - the ONLY output
        // ------------------------------------------------------------
        
        function speak(text, callback) {
            if (!window.speechSynthesis) {
                if (callback) callback();
                return;
            }
            
            try {
                window.speechSynthesis.cancel();
            } catch(e) {
                // Ignore cancel errors
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            utterance.onend = function() {
                if (callback) callback();
            };
            
            utterance.onerror = function() {
                if (callback) callback();
            };
            
            try {
                window.speechSynthesis.speak(utterance);
            } catch(e) {
                if (callback) callback();
            }
        }

        // ------------------------------------------------------------
        // SECTION 15: SEQUENTIAL SPEECH
        // ------------------------------------------------------------
        
        function speakSequence(messages, callback) {
            if (!messages || messages.length === 0) {
                if (callback) callback();
                return;
            }
            
            const message = messages.shift();
            speak(message, function() {
                speakSequence(messages, callback);
            });
        }

                    'a spike-filled chamber. Deadly traps line the walls.',
                    'a poison gas room. Strange vapors seep from cracks.'
                ],
                hasEnemy: false
            },
            stairs: {
                descriptions: [
                    'a spiral stairwell. Dark stone steps descend into deeper darkness.',
                    'a grand staircase. Ancient carvings decorate the descent.',
                    'a hidden passage. Secret stairs lead to the next level.'
                ],
                hasEnemy: false
            },
            fountain: {
                descriptions: [
                    'a magical fountain room. Crystal clear water bubbles from an enchanted spring.',
                    'a healing spring. Glowing water promises restoration.',
                    'a sacred pool. Divine energy radiates from the water.'
                ],
                hasEnemy: false
            },
            merchant: {
                descriptions: [
                    'a traveling merchant\'s camp. A friendly trader waves you over.',
                    'an underground shop. A hooded figure displays wares on a worn carpet.',
                    'a merchant\'s alcove. Potions and equipment line makeshift shelves.'
                ],
                hasEnemy: false
            },
            shrine: {
                descriptions: [
                    'an ancient shrine. A statue glows with mysterious power.',
                    'a blessed altar. Divine energy pulses gently.',
                    'a forgotten temple. The air hums with magic.'
                ],
                hasEnemy: false
            },
            library: {
                descriptions: [
                    'a dusty library. Ancient tomes line the shelves.',
                    'a wizard\'s study. Magical books float in the air.',
                    'a scholar\'s archive. Knowledge awaits discovery.'
                ],
                hasEnemy: false
            },
            crypt: {
                descriptions: [
                    'a burial crypt. Stone coffins line the walls.',
                    'a tomb of heroes. Ancient warriors rest here.',
                    'a mausoleum. The dead sleep uneasily.'
                ],
                hasEnemy: false
            }
        };

        // ------------------------------------------------------------
        // SECTION 32: HELPER FUNCTION - Get Random Description
        // ------------------------------------------------------------
        
        function getRandomDescription(roomType) {
            const type = roomTypes[roomType];
            if (!type || !type.descriptions || type.descriptions.length === 0) {
                return 'a mysterious chamber.';
            }
            return type.descriptions[Math.floor(Math.random() * type.descriptions.length)];
        }

        // ------------------------------------------------------------
        // SECTION 33: HELPER FUNCTION - Scale Enemy for Level
        // Scales enemy stats based on dungeon level
        // ------------------------------------------------------------
        
        function scaleEnemyForLevel(enemy, level) {
            const scaleFactor = 1 + ((level - 1) * 0.25);
            const floorMultiplier = getFloorMultiplier();
            
            return {
                ...enemy,
                health: Math.floor(enemy.health * scaleFactor * floorMultiplier),
                damage: Math.floor(enemy.damage * scaleFactor * floorMultiplier),
                gold: Math.floor(enemy.gold * scaleFactor),
                exp: Math.floor(enemy.exp * scaleFactor),
                regenerate: enemy.regenerate ? Math.floor(enemy.regenerate * floorMultiplier) : undefined,
                maxHealth: Math.floor(enemy.health * scaleFactor * floorMultiplier)
            };
        }

        // ------------------------------------------------------------
        // SECTION 34: HELPER FUNCTION - Get Floor Multiplier
        // Returns multiplier based on current dungeon level
        // ------------------------------------------------------------
        
        function getFloorMultiplier() {
            const floor = game.dungeon.currentLevel;
            if (floor >= 30) return 4.0;
            if (floor >= 20) return 2.5;
            if (floor >= 10) return 1.5;
            return 1.0;
        }

        // ------------------------------------------------------------
        // SECTION 35: HELPER FUNCTION - Select Enemy Type
        // Chooses appropriate enemy based on floor and distance
        // ------------------------------------------------------------
        
        function selectEnemyType(currentLevel, distance, isElite) {
            // Endgame floors 20+
            if (currentLevel >= 20) {
                if (distance === 'far') return isElite ? 'harbingerOfRagnarok' : 'titanLord';
                if (distance === 'medium') return isElite ? 'cosmicHorror' : 'voidBeast';
                return isElite ? 'demonLord' : 'ancientDragon';
            }
            
            // High level floors 10-19
            if (currentLevel >= 10) {
                if (distance === 'far') return isElite ? 'ancientDragon' : 'voidBeast';
                if (distance === 'medium') return isElite ? 'demonLord' : 'lichKing';
                return isElite ? 'archDemon' : 'elderTroll';
            }
            
            // Mid level floors 5-9
            if (currentLevel >= 5) {
                if (distance === 'far') return isElite ? 'hydra' : 'archDemon';
                if (distance === 'medium') return isElite ? 'elderTroll' : 'demon';
                return isElite ? 'vampire' : 'troll';
            }
            
            // Early floors 3-4
            if (currentLevel >= 3) {
                if (distance === 'far') return isElite ? 'demon' : 'troll';
                if (distance === 'medium') return isElite ? 'vampire' : 'wraith';
                return isElite ? 'orc' : 'zombie';
            }
            
            // Starting floors 1-2
            if (distance === 'far') return isElite ? 'wraith' : 'orc';
            if (distance === 'medium') return isElite ? 'zombie' : 'skeleton';
            return isElite ? 'skeleton' : 'goblin';
        }

        // ------------------------------------------------------------
        // SECTION 36: HELPER FUNCTION - Get Boss for Level
        // Returns appropriate boss based on dungeon level
        // ------------------------------------------------------------
        
        function getBossForLevel(level) {
            if (level >= 20) {
                return scaleEnemyForLevel(enemies.apocalypseTitan, level);
            } else if (level >= 10) {
                return scaleEnemyForLevel(enemies.voidEmperor, level);
            } else {
                return scaleEnemyForLevel(enemies.dragon, level);
            }
        }

        // ------------------------------------------------------------
        // END OF CHUNK 3
        // 
        // Chunk 4 will contain:

        // ------------------------------------------------------------
        // ECHO DUNGEON V14 - CHUNK 4
        // Dungeon Generation, Movement, Room Description
        // ------------------------------------------------------------

        // ------------------------------------------------------------
        // SECTION 37: DUNGEON GENERATION
        // V10.5 distance-based system - harder enemies further from center
        // Boss at corner (11,11), stairs at (11,10)
        // NO EMPTY ROOMS - every room has content!
        // ------------------------------------------------------------
        
        function generateDungeon() {
            const size = game.dungeon.size;
            const currentLevel = game.dungeon.currentLevel;
            game.dungeon.grid = {};
            
            const centerX = 6;
            const centerY = 6;
            
            for (let x = 0; x < size; x++) {
                for (let y = 0; y < size; y++) {
                    const key = `${x},${y}`;
                    const distanceX = Math.abs(x - centerX);
                    const distanceY = Math.abs(y - centerY);
                    const distanceFromCenter = distanceX + distanceY;
                    
                    let roomData = { 
                        visited: false, 
                        searched: false, 
                        hasChest: false, 
                        fountainUsed: false,
                        shrineUsed: false,
                        librarySearched: false
                    };
                    
                    // ENTRANCE at center (6,6) - has a welcome chest!
                    if (x === centerX && y === centerY) {
                        game.dungeon.grid[key] = {
                            type: 'entrance',
                            description: getRandomDescription('entrance'),
                            ...roomData,
                            hasChest: true,
                            visited: true
                        };
                        continue;
                    }
                    
                    // BOSS ROOM at far corner (11,11)
                    if (x === size - 1 && y === size - 1) {
                        const bossEnemy = getBossForLevel(currentLevel);
                        game.dungeon.grid[key] = {
                            type: 'boss',
                            description: getRandomDescription('boss'),
                            ...roomData,
                            hasChest: true,
                            enemy: bossEnemy
                        };
                        continue;
                    }
                    
                    // STAIRS at (11,10) - just before boss
                    if (x === size - 1 && y === size - 2) {
                        game.dungeon.grid[key] = {
                            type: 'stairs',
                            description: getRandomDescription('stairs'),
                            ...roomData
                        };
                        continue;
                    }
                    
                    // Generate room content based on distance from center
                    // NO EMPTY ROOMS - every room has something!
                    const roll = Math.random();
                    const isElite = currentLevel >= 2 && Math.random() < 0.15;
                    
                    let roomType = null;
                    let enemyType = null;
                    
                    // 8% chance for merchant anywhere
                    if (roll < 0.08) {
                        game.dungeon.grid[key] = {
                            type: 'merchant',
                            description: getRandomDescription('merchant'),
                            ...roomData
                        };
                        continue;
                    }
                    
                    // 7% chance for fountain
                    if (roll < 0.15) {
                        game.dungeon.grid[key] = {
                            type: 'fountain',
                            description: getRandomDescription('fountain'),
                            ...roomData
                        };
                        continue;
                    }
                    
                    // 6% chance for shrine
                    if (roll < 0.21) {
                        game.dungeon.grid[key] = {
                            type: 'shrine',
                            description: getRandomDescription('shrine'),
                            ...roomData
                        };
                        continue;
                    }
                    
                    // 5% chance for library (ability books!)
                    if (roll < 0.26) {
                        game.dungeon.grid[key] = {
                            type: 'library',
                            description: getRandomDescription('library'),
                            ...roomData,
                            hasChest: true
                        };
                        continue;
                    }
                    
                    // Distance-based content for remaining rooms
                    // FAR from center (distance 7+): Harder enemies, better loot
                    if (distanceFromCenter >= 7) {
                        if (Math.random() < 0.55) {
                            // 55% enemy rooms in far areas
                            enemyType = selectEnemyType(currentLevel, 'far', isElite);
                            roomType = 'enemy';
                        } else if (Math.random() < 0.7) {
                            // Good treasure in dangerous areas
                            roomType = 'treasure';
                            roomData.hasChest = true;
                        } else {
                            // Crypts with possible loot
                            roomType = 'crypt';
                            roomData.hasChest = Math.random() < 0.4;
                        }
                    }
                    // MEDIUM distance (4-6): Balanced content
                    else if (distanceFromCenter >= 4) {
                        if (Math.random() < 0.50) {
                            // 50% enemy rooms
                            enemyType = selectEnemyType(currentLevel, 'medium', isElite);
                            roomType = 'enemy';
                        } else if (Math.random() < 0.6) {
                            // Treasure rooms
                            roomType = 'treasure';
                            roomData.hasChest = true;
                        } else if (Math.random() < 0.8) {
                            // Trap rooms (but with loot!)
                            roomType = 'trap';
                            roomData.hasChest = Math.random() < 0.5;
                        } else {
                            // Crypt
                            roomType = 'crypt';
                            roomData.hasChest = Math.random() < 0.3;
                        }
                    }
                    // NEAR center (0-3): Easier start
                    else {
                        if (Math.random() < 0.45) {
                            // 45% enemy rooms near start
                            enemyType = selectEnemyType(currentLevel, 'near', isElite);
                            roomType = 'enemy';
                        } else if (Math.random() < 0.7) {
                            // Good chance for treasure near start
                            roomType = 'treasure';
                            roomData.hasChest = true;
                        } else {
                            // Trap with possible loot
                            roomType = 'trap';
                            roomData.hasChest = Math.random() < 0.3;
                        }
                    }
                    
                    // Create the room
                    if (roomType === 'enemy' && enemyType) {
                        let scaledEnemy = scaleEnemyForLevel(enemies[enemyType], currentLevel);
                        
                        // 20% chance for double enemy encounter on floor 3+
                        if (currentLevel >= 3 && Math.random() < 0.20) {
                            game.dungeon.grid[key] = {
                                type: 'enemy',
                                description: getRandomDescription('enemy') + ' Two creatures lurk here!',
                                ...roomData,
                                hasChest: Math.random() < 0.3,
                                enemy: scaledEnemy,
                                secondEnemy: scaleEnemyForLevel(enemies[enemyType], currentLevel)
                            };
                        } else {
                            game.dungeon.grid[key] = {
                                type: 'enemy',
                                description: getRandomDescription('enemy'),
                                ...roomData,
                                hasChest: Math.random() < 0.25,
                                enemy: scaledEnemy
                            };
                        }
                    } else {
                        game.dungeon.grid[key] = {
                            type: roomType,
                            description: getRandomDescription(roomType),
                            ...roomData
                        };
                    }
                }
            }
            
            // Set player starting position and current room
            game.player.position = { x: centerX, y: centerY };
            game.currentRoom = game.dungeon.grid[`${centerX},${centerY}`];
        }

        // ------------------------------------------------------------
        // SECTION 38: MOVEMENT FUNCTIONS
        // North, South, East, West movement with boundary checking
        // ------------------------------------------------------------
        
        function movePlayer(direction) {
            if (game.combat) {
                speak('You cannot move while in combat! You must fight, defend, or flee.');
                return;
            }
            
            if (game.merchantOpen) {
                speak('You are talking to the merchant. Say leave to exit the shop first.');
                return;
            }
            
            const pos = game.player.position;
            let newX = pos.x;
            let newY = pos.y;
            
            switch (direction) {
                case 'north':
                    newY--;
                    break;
                case 'south':
                    newY++;
                    break;
                case 'east':
                    newX++;
                    break;
                case 'west':
                    newX--;
                    break;
            }
            
            // Check boundaries
            if (newX < 0 || newX >= game.dungeon.size || newY < 0 || newY >= game.dungeon.size) {
                speak('You cannot go that way. You have reached the edge of the dungeon.');
                return;
            }
            
            // Move player
            game.player.position.x = newX;
            game.player.position.y = newY;
            
            const key = `${newX},${newY}`;
            game.currentRoom = game.dungeon.grid[key];
            game.currentRoom.visited = true;
            
            // Track rooms explored for auto-save
            game.player.roomsExplored++;
            
            // Auto-save every 5 rooms
            if (game.player.roomsExplored % 5 === 0 && game.player.name) {
                autoSave();
            }
            
            // Describe the new room
            describeRoom();
        }

        // ------------------------------------------------------------
        // SECTION 39: ROOM DESCRIPTION
        // Describes current room and triggers encounters
        // ------------------------------------------------------------
        
        function describeRoom() {
            const room = game.currentRoom;
            
            if (!room) {
                speak('You are in an unknown void. Something went wrong.');
                return;
            }
            
            let messages = [];
            
            // First visit or return visit
            if (!room.visited) {
                messages.push(`You enter ${room.description}`);
            } else {
                messages.push(`You are in ${room.description}`);
            }
            
            // Room-specific content
            switch (room.type) {
                case 'entrance':
                    if (room.hasChest && !room.searched) {
                        messages.push('A welcome chest awaits you here. Say open chest to see what is inside.');
                    }
                    messages.push('This is where your adventure began. The boss lurks in the far southeast corner.');
                    break;
                    
                case 'enemy':
                    if (room.enemy && room.enemy.health > 0) {
                        if (room.secondEnemy && room.secondEnemy.health > 0) {
                            messages.push(`Two ${room.enemy.name}s block your path!`);
                            messages.push(`The first has ${room.enemy.health} health. The second has ${room.secondEnemy.health} health.`);
                        } else {
                            messages.push(`A ${room.enemy.name} blocks your path! It has ${room.enemy.health} health.`);
                        }
                        messages.push('Prepare for battle! Say attack, defend, special, or flee.');
                        
                        // Start combat
                        speakSequence(messages, () => {
                            startCombat();
                        });
                        return;
                    } else {
                        messages.push('The enemy here has been defeated.');
                        if (room.hasChest && !room.searched) {
                            messages.push('There is a chest here. Say open chest to loot it.');
                        }
                    }
                    break;
                    
                case 'boss':
                    if (room.enemy && room.enemy.health > 0) {
                        messages.push(`The mighty ${room.enemy.name} awaits you! This is the floor boss!`);
                        messages.push(`It has ${room.enemy.health} health. This will be a difficult fight!`);
                        messages.push('Prepare yourself! Say attack, defend, special, or flee.');
                        
                        speakSequence(messages, () => {
                            startCombat();
                        });
                        return;
                    } else {
                        messages.push('You have defeated the boss of this floor! A treasure chest awaits your victory.');
                        if (room.hasChest && !room.searched) {
                            messages.push('Say open chest to claim your reward.');
                        }
                    }
                    break;
                    
                case 'treasure':
                    if (room.hasChest && !room.searched) {
                        messages.push('A treasure chest gleams in the torchlight! Say open chest to see what is inside.');
                    } else {
                        messages.push('This treasure room has already been looted.');
                    }
                    break;
                    
                case 'fountain':
                    if (!room.fountainUsed) {
                        messages.push('A magical fountain bubbles with healing water. Say drink fountain to restore your health and mana.');
                    } else {
                        messages.push('The fountain has been drained of its magic.');
                    }
                    break;
                    
                case 'merchant':
                    messages.push('A friendly merchant greets you warmly. Say merchant or talk to merchant to see their wares.');
                    break;
                    
                case 'shrine':
                    if (!room.shrineUsed) {
                        messages.push('An ancient shrine pulses with mysterious energy. Say use shrine to receive a blessing.');
                    } else {
                        messages.push('The shrine has already granted its blessing.');
                    }
                    break;
                    
                case 'library':
                    if (room.hasChest && !room.searched) {
                        messages.push('Dusty bookshelves line the walls. You spot an old tome that might contain useful knowledge. Say open chest to investigate.');
                    } else {
                        messages.push('The library has been searched. Empty shelves gather dust.');
                    }
                    break;
                    
                case 'stairs':
                    messages.push('A staircase descends into deeper darkness. Say go down stairs or use stairs to descend to the next floor.');
                    messages.push('Warning: You cannot return to this floor once you descend!');
                    break;
                    
                case 'trap':
                    if (!room.searched) {
                        // Trigger trap damage
                        const trapDamage = Math.floor(10 + (game.dungeon.currentLevel * 5));
                        const actualDamage = Math.floor(trapDamage / game.player.defenseMultiplier);
                        game.player.health -= actualDamage;
                        
                        messages.push(`You triggered a trap! You take ${actualDamage} damage.`);
                        
                        if (game.player.health <= 0) {
                            speakSequence(messages, () => {
                                playerDeath();
                            });
                            return;
                        }
                        
                        messages.push(`Your health is now ${game.player.health} of ${game.player.maxHealth}.`);
                        room.searched = true;
                        
                        if (room.hasChest) {
                            messages.push('Despite the trap, you notice a chest hidden here. Say open chest to loot it.');
                        }
                    } else {
                        messages.push('You carefully avoid the disabled trap.');
                        if (room.hasChest && !room.searched) {
                            messages.push('There is a chest here. Say open chest.');
                        }
                    }
                    break;
                    
                case 'crypt':
                    messages.push('The dead rest here, perhaps not peacefully.');
                    if (room.hasChest && !room.searched) {
                        messages.push('You notice a burial offering that might be worth something. Say open chest to investigate.');
                    }
                    break;
                    
                default:
                    if (room.hasChest && !room.searched) {
                        messages.push('There is a chest here. Say open chest.');
                    }
            }
            
            // Add position hint occasionally
            if (Math.random() < 0.3) {
                const distToBoss = (11 - game.player.position.x) + (11 - game.player.position.y);
                if (distToBoss <= 4) {
                    messages.push('You sense great danger nearby. The boss is close.');
                } else if (distToBoss <= 8) {
                    messages.push('You are getting closer to the southeast corner where the boss awaits.');
                }
            }
            
            speakSequence(messages);
        }

        // ------------------------------------------------------------
        // SECTION 40: AUTO-SAVE FUNCTION
        // Saves game automatically every 5 rooms
        // ------------------------------------------------------------
        
        function autoSave() {
            if (!game.player.name) return;
            
            try {
                const saveData = {
                    version: 'V14',
                    timestamp: Date.now(),
                    player: JSON.parse(JSON.stringify(game.player)),
                    dungeon: {
                        grid: game.dungeon.grid,
                        size: game.dungeon.size,
                        currentLevel: game.dungeon.currentLevel,
                        hasSecretRoom: game.dungeon.hasSecretRoom
                    }
                };
                
                const saveKey = `echoDungeon_char_${game.player.name.toLowerCase()}`;
                localStorage.setItem(saveKey, JSON.stringify(saveData));
                
                // Silent auto-save, no announcement
            } catch (e) {
                // Silent fail on auto-save
            }
        }

        // ------------------------------------------------------------
        // SECTION 41: USE FOUNTAIN
        // Restores health and mana fully
        // ------------------------------------------------------------
        
        function useFountain() {
            const room = game.currentRoom;
            
            if (room.type !== 'fountain') {
                speak('There is no fountain here.');
                return;
            }
            
            if (room.fountainUsed) {
                speak('This fountain has already been used. Its magic is spent.');
                return;
            }
            
            room.fountainUsed = true;
            game.player.health = game.player.maxHealth;
            game.player.mana = game.player.maxMana;
            
            speak(`You drink deeply from the magical fountain. Refreshing! Your health and mana are fully restored. Health: ${game.player.health}. Mana: ${game.player.mana}.`);
        }

        // ------------------------------------------------------------
        // SECTION 42: USE SHRINE
        // Grants random blessing
        // ------------------------------------------------------------
        
        function useShrine() {
            const room = game.currentRoom;
            
            if (room.type !== 'shrine') {
                speak('There is no shrine here.');
                return;
            }
            
            if (room.shrineUsed) {
                speak('This shrine has already granted its blessing.');
                return;
            }
            
            room.shrineUsed = true;
            
            const blessings = [
                { type: 'health', value: 20, message: 'The shrine blesses you with vitality! Your maximum health increases by 20.' },
                { type: 'mana', value: 15, message: 'The shrine blesses you with wisdom! Your maximum mana increases by 15.' },
                { type: 'attack', value: 5, message: 'The shrine blesses you with strength! Your attack power increases by 5.' },
                { type: 'gold', value: 100, message: 'The shrine rewards your devotion! You receive 100 gold.' },
                { type: 'heal', value: 0, message: 'The shrine fills you with divine energy! You are fully healed.' },
                { type: 'exp', value: 50, message: 'The shrine grants you ancient knowledge! You gain 50 experience.' }
            ];
            
            const blessing = blessings[Math.floor(Math.random() * blessings.length)];
            
            switch (blessing.type) {
                case 'health':
                    game.player.maxHealth += blessing.value;
                    game.player.health += blessing.value;
                    break;
                case 'mana':
                    game.player.maxMana += blessing.value;
                    game.player.mana += blessing.value;
                    break;
                case 'attack':
                    game.player.baseAttack += blessing.value;
                    break;
                case 'gold':
                    game.player.gold += blessing.value;
                    break;
                case 'heal':
                    game.player.health = game.player.maxHealth;
                    game.player.mana = game.player.maxMana;
                    break;
                case 'exp':
                    gainExperience(blessing.value);
                    break;
            }
            
            speak(blessing.message);
        }

        // ------------------------------------------------------------
        // SECTION 43: USE STAIRS
        // Descend to next dungeon level
        // ------------------------------------------------------------
        
        function useStairs() {
            const room = game.currentRoom;
            
            if (room.type !== 'stairs') {
                speak('There are no stairs here.');
                return;
            }
            
            game.dungeon.currentLevel++;
            
            // Check for floor multiplier update
            updateFloorMultipliers();
            
            speakSequence([
                `You descend the ancient stairs into deeper darkness.`,
                `You are now on dungeon level ${game.dungeon.currentLevel}.`,
                `The enemies here will be stronger, but the rewards greater.`,
                `Generating new dungeon floor...`
            ], () => {
                generateDungeon();
                speak('You emerge into a new area. Your adventure continues!', () => {
                    describeRoom();
                });
            });
        }

        // ------------------------------------------------------------

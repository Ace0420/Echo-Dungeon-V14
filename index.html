        // ------------------------------------------------------------
        // SECTION 75: MERCHANT - PURCHASE ITEM
        // Handles buying items, supports multiple quantities
        // "purchase 3 health potions" or "purchase health potion"
        // ------------------------------------------------------------
        
        function merchantPurchase(command) {
            if (!game.merchantOpen) {
                speak('You are not at a merchant. Find one first!');
                return;
            }
            
            // Parse quantity from command
            let quantity = 1;
            const quantityMatch = command.match(/(\d+)/);
            if (quantityMatch) {
                quantity = parseInt(quantityMatch[1]);
                if (quantity < 1) quantity = 1;
                if (quantity > 99) quantity = 99;
            }
            
            // Find the item
            let itemToBuy = null;
            const commandLower = command.toLowerCase();
            
            for (let item of merchantItems) {
                if (commandLower.includes(item.name.toLowerCase())) {
                    itemToBuy = item;
                    break;
                }
            }
            
            // Try partial matching
            if (!itemToBuy) {
                for (let item of merchantItems) {
                    const itemWords = item.name.toLowerCase().split(' ');
                    let matchCount = 0;
                    for (let word of itemWords) {
                        if (commandLower.includes(word)) matchCount++;
                    }
                    if (matchCount >= 2 || (itemWords.length === 2 && matchCount >= 1)) {
                        itemToBuy = item;
                        break;
                    }
                }
            }
            
            if (!itemToBuy) {
                speak('I do not have that item. Say what do you have to see my stock.');
                return;
            }
            
            // Check level requirement
            if (itemToBuy.minLevel && game.player.level < itemToBuy.minLevel) {
                speak(`You need to be level ${itemToBuy.minLevel} to purchase ${itemToBuy.name}.`);
                return;
            }
            
            // Check class requirement for equipment
            if (itemToBuy.class && itemToBuy.class !== game.player.class) {
                speak(`${itemToBuy.name} is for ${itemToBuy.class}s only.`);
                return;
            }
            
            // Special items can only be bought once
            if (itemToBuy.type === 'special_item') {
                if (game.player.specialItems.includes(itemToBuy.name)) {
                    speak(`You already have a ${itemToBuy.name}. It is a one of a kind item!`);
                    return;
                }
                quantity = 1; // Force quantity to 1 for special items
            }
            
            // Calculate total cost
            const totalCost = itemToBuy.price * quantity;
            
            // Check gold
            if (game.player.gold < totalCost) {
                if (quantity > 1) {
                    const canAfford = Math.floor(game.player.gold / itemToBuy.price);
                    if (canAfford > 0) {
                        speak(`You cannot afford ${quantity}. You can only afford ${canAfford} ${itemToBuy.name}${canAfford > 1 ? 's' : ''} for ${canAfford * itemToBuy.price} gold. You have ${game.player.gold} gold.`);
                    } else {
                        speak(`You cannot afford ${itemToBuy.name}. It costs ${itemToBuy.price} gold and you only have ${game.player.gold}.`);
                    }
                } else {
                    speak(`You cannot afford ${itemToBuy.name}. It costs ${itemToBuy.price} gold and you only have ${game.player.gold}.`);
                }
                return;
            }
            
            // Process purchase
            game.player.gold -= totalCost;
            
            let messages = [];
            
            // Add items based on type
            for (let i = 0; i < quantity; i++) {
                switch (itemToBuy.type) {
                    case 'potion':
                        game.player.inventory.push(itemToBuy.name);
                        break;
                        
                    case 'special_potion':
                        if (itemToBuy.effect === 'revive') {
                            game.player.activeEffects.push({ type: 'revive', name: itemToBuy.name });
                        } else {
                            game.player.inventory.push(itemToBuy.name);
                        }
                        break;
                        
                    case 'special_item':
                        game.player.specialItems.push(itemToBuy.name);
                        break;
                        
                    case 'special_ring':
                        game.player.inventory.push(itemToBuy.name);
                        break;
                        
                    case 'special_amulet':
                        game.player.inventory.push(itemToBuy.name);
                        break;
                        
                    case 'weapon':
                    case 'armor':
                        game.player.inventory.push(itemToBuy.name);
                        break;
                        
                    default:
                        game.player.inventory.push(itemToBuy.name);
                }
            }
            
            if (quantity > 1) {
                messages.push(`Excellent! You purchased ${quantity} ${itemToBuy.name}s for ${totalCost} gold!`);
            } else {
                messages.push(`Excellent! You purchased ${itemToBuy.name} for ${totalCost} gold!`);
            }
            
            messages.push(itemToBuy.description);
            messages.push(`You now have ${game.player.gold} gold remaining.`);
            
            // Special messages for certain items
            if (itemToBuy.name === 'Ring of Regeneration') {
                messages.push('Remember to equip it! Say equip Ring of Regeneration.');
            }
            if (itemToBuy.name === 'Elixir of Immortality') {
                messages.push('The elixir is now active. It will save you from death once!');
            }
            
            speakSequence(messages);
        }

        // ------------------------------------------------------------
        // SECTION 76: MERCHANT - SELL JUNK
        // Sells all items in junk bag
        // ------------------------------------------------------------
        
        function merchantSellJunk() {
            if (!game.merchantOpen) {
                speak('You are not at a merchant. Find one first!');
                return;
            }
            
            if (game.player.junkBag.length === 0) {
                speak('Your junk bag is empty. Nothing to sell!');
                return;
            }
            
            let totalValue = 0;
            let itemCount = game.player.junkBag.length;
            
            for (let item of game.player.junkBag) {
                const treasure = treasures.find(t => t.name === item);
                const ring = rings.find(r => r.name === item);
                const amulet = amulets.find(a => a.name === item);
                const weapon = equipment.weapons.find(w => w.name === item);
                const armor = equipment.armor.find(a => a.name === item);
                const shield = equipment.shields.find(s => s.name === item);
                const helmet = equipment.helmets.find(h => h.name === item);
                const glove = equipment.gloves.find(g => g.name === item);
                const boot = equipment.boots.find(b => b.name === item);
                const bracelet = equipment.bracelets.find(b => b.name === item);
                
                const itemData = treasure || weapon || armor || shield || helmet || glove || boot || bracelet;
                if (itemData) {
                    totalValue += Math.floor((itemData.value || itemData.price || 0) * 0.6);
                }
                if (ring) totalValue += Math.floor(ring.price * 0.6);
                if (amulet) totalValue += Math.floor(amulet.price * 0.6);
            }
            
            game.player.gold += totalValue;
            game.player.junkBag = [];
            
            speakSequence([
                `Wonderful doing business with you!`,
                `I bought ${itemCount} items from your junk bag for ${totalValue} gold!`,
                `You now have ${game.player.gold} gold.`
            ]);
        }

        // ------------------------------------------------------------
        // SECTION 78: USE POTION (Outside Combat)
        // ------------------------------------------------------------
        
        function usePotion(potionType) {
            if (game.combat) {
                speak('In combat, use the defend command to drink a potion safely.');
                return;
            }
            
            let potionName = null;
            let potionIndex = -1;
            
            if (potionType === 'health') {
                const potionOrder = ['Health Potion', 'Greater Health Potion', 'Supreme Health Potion', 'Ultimate Health Potion'];
                for (let name of potionOrder) {
                    const idx = game.player.inventory.indexOf(name);
                    if (idx !== -1) {
                        potionName = name;
                        potionIndex = idx;
                        break;
                    }
                }
            } else if (potionType === 'mana') {
                const potionOrder = ['Mana Potion', 'Greater Mana Potion', 'Supreme Mana Potion', 'Ultimate Mana Potion'];
                for (let name of potionOrder) {
                    const idx = game.player.inventory.indexOf(name);
                    if (idx !== -1) {
                        potionName = name;
                        potionIndex = idx;
                        break;
                    }
                }
            }
            
            if (!potionName) {
                speak(`You have no ${potionType} potions.`);
                return;
            }
            
            game.player.inventory.splice(potionIndex, 1);
            
            const potionData = merchantItems.find(p => p.name === potionName);
            
            if (potionType === 'health') {
                const healing = potionData ? potionData.healing : 50;
                const oldHealth = game.player.health;
                game.player.health = Math.min(game.player.maxHealth, game.player.health + healing);
                const actualHeal = game.player.health - oldHealth;
                speak(`You drink a ${potionName} and restore ${actualHeal} health. Your health is now ${game.player.health} of ${game.player.maxHealth}.`);
            } else {
                const manaRestore = potionData ? potionData.mana : 40;
                const oldMana = game.player.mana;
                game.player.mana = Math.min(game.player.maxMana, game.player.mana + manaRestore);
                const actualRestore = game.player.mana - oldMana;
                speak(`You drink a ${potionName} and restore ${actualRestore} mana. Your mana is now ${game.player.mana} of ${game.player.maxMana}.`);
            }
        }

        // ------------------------------------------------------------
        // SECTION 83: SPEECH RECOGNITION SETUP
        // ------------------------------------------------------------
        
        function setupSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                speak('Sorry, your browser does not support speech recognition. Please use Chrome or Edge.');
                return false;
            }
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            recognition.onstart = function() {
                game.listening = true;
                micButton.classList.add('listening');
            };

            recognition.onend = function() {
                stopListening();
            };

            recognition.onerror = function(event) {
                stopListening();

                if (event.error === 'no-speech') {
                    speak('I did not hear anything. Tap and try again.');
                } else if (event.error === 'not-allowed') {
                    speak('Microphone access denied. Please allow microphone access and reload the page.');
                }
            };

            recognition.onresult = function(event) {
                const command = event.results[0][0].transcript.toLowerCase().trim();
                stopListening();
                setTimeout(() => processCommand(command), 500);
            };
            
            return true;
        }

        // ------------------------------------------------------------
        // SECTION 84: START LISTENING
        // ------------------------------------------------------------
        
        function startListening() {
            if (!recognition) {
                if (!setupSpeechRecognition()) return;
            }

            if (game.listening) {
                stopListening();
                return;
            }

            try {
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                }
            } catch(e) {
                // Ignore errors
            }

            try {
                recognition.start();
            } catch (e) {
                // Already started
            }
        }

        // ------------------------------------------------------------
        // SECTION 84.5: STOP LISTENING
        // ------------------------------------------------------------

        function stopListening() {
            game.listening = false;
            micButton.classList.remove('listening');
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    // Ignore stop errors
                }
            }
        }

        // ------------------------------------------------------------
        // SECTION 84.7: SELECT CLASS V12 STYLE
        // Simplified character creation like V12 - just pick class and go
        // ------------------------------------------------------------

        function selectClassV12(className) {
            const classData = classes[className];

            if (!classData) {
                speak('Invalid class selection.');
                return;
            }

            // Set class
            game.player.class = className;

            // Set default name (use class name - user can change when saving)
            game.player.name = classData.name;

            // Set default race (human)
            game.player.race = 'human';

            // Set default gender (empty - not used in V12 style)
            game.player.gender = '';

            // Apply class base stats
            game.player.health = classData.health;
            game.player.maxHealth = classData.maxHealth;
            game.player.mana = classData.mana;
            game.player.maxMana = classData.maxMana;
            game.player.gold = classData.gold;

            // Apply class base attributes
            game.player.strength = classData.baseStrength;
            game.player.dexterity = classData.baseDexterity;
            game.player.wisdom = classData.baseWisdom;

            // Apply default race bonuses (human)
            const raceData = races['human'];
            game.player.strength += raceData.bonuses.strength;
            game.player.dexterity += raceData.bonuses.dexterity;
            game.player.wisdom += raceData.bonuses.wisdom;

            // Equip starting gear
            game.player.weapon = classData.startWeapon;
            game.player.armor = classData.startArmor;
            if (classData.startShield) {
                game.player.shield = classData.startShield;
            }

            // Add starting items to inventory
            for (let item of classData.items) {
                if (item !== classData.startWeapon && item !== classData.startArmor && item !== classData.startShield) {
                    game.player.inventory.push(item);
                }
            }

            // Calculate derived stats
            calculateDerivedStats();
            updateDefense();

            // Mark as initialized
            game.initialized = true;
            game.phase = 'exploration';

            // Generate dungeon
            generateDungeon();

            // Welcome message - V12 style (shorter, simpler)
            speakSequence([
                `You are now a ${classData.name}!`,
                `Health: ${game.player.health}. Mana: ${game.player.mana}. Gold: ${game.player.gold}.`,
                `You stand at the entrance of the dungeon.`,
                `Say help for commands, or start exploring! Good luck!`
            ], () => {
                setTimeout(() => describeRoom(), 1000);
            });
        }

        // ------------------------------------------------------------
        // SECTION 85: PROCESS COMMAND - MAIN ROUTER
        // Routes voice commands to appropriate functions
        // ------------------------------------------------------------

        function processCommand(command) {
            const cmd = command.toLowerCase().trim();
            
            // ----------------------------------------
            // PHASE: Not started - first tap
            // ----------------------------------------
            if (!game.started) {
                game.started = true;
                speakSequence([
                    'Welcome to Echo Dungeon!',
                    'A voice controlled adventure designed for blind and visually impaired players.',
                    'Tap anywhere on the screen, then speak your command.',
                    'Choose your class: Warrior, Mage, Rogue, Ranger, or Cleric.',
                    'Or say load game to continue a saved character.'
                ]);
                return;
            }
            
            // ----------------------------------------
            // PHASE: Main menu - Class selection
            // ----------------------------------------
            if (!game.initialized) {
                if (cmd.includes('load')) {
                    const loadMatch = cmd.replace('load', '').replace('game', '').trim();
                    if (loadMatch) {
                        loadGame(loadMatch);
                    } else {
                        loadGame();
                    }
                    return;
                }

                if (cmd.includes('list') && cmd.includes('save')) {
                    listSavedCharacters();
                    return;
                }

                // Direct class selection - V12 style
                if (cmd.includes('warrior') || cmd.includes('fighter') || cmd.includes('knight')) {
                    selectClassV12('warrior');
                    return;
                }
                if (cmd.includes('mage') || cmd.includes('wizard') || cmd.includes('sorcerer')) {
                    selectClassV12('mage');
                    return;
                }
                if (cmd.includes('rogue') || cmd.includes('thief') || cmd.includes('assassin')) {
                    selectClassV12('rogue');
                    return;
                }
                if (cmd.includes('ranger') || cmd.includes('archer') || cmd.includes('hunter')) {
                    selectClassV12('ranger');
                    return;
                }
                if (cmd.includes('cleric') || cmd.includes('priest') || cmd.includes('healer')) {
                    selectClassV12('cleric');
                    return;
                }

                speak('Choose your class: Warrior, Mage, Rogue, Ranger, or Cleric. Or say load game to continue a saved character.');
                return;
            }
            
            // ----------------------------------------
            // PHASE: Character creation - naming (DISABLED - V12 STYLE)
            // ----------------------------------------
            if (false && game.phase === 'naming') {
                let name = cmd.replace(/my name is/gi, '')
                             .replace(/i am/gi, '')
                             .replace(/call me/gi, '')
                             .replace(/it's/gi, '')
                             .trim();
                
                name = name.charAt(0).toUpperCase() + name.slice(1);
                
                if (name.length < 2) {
                    speak('Please tell me your name. Just say it clearly.');
                    return;
                }
                
                game.player.name = name;
                game.phase = 'gender';
                
                speakSequence([
                    `${name}! A fine name indeed.`,
                    'Now, how would you like to be addressed?',
                    'Say dude for male, chick for female, or non-binary.'
                ]);
                return;
            }
            
            // ----------------------------------------
            // PHASE: Character creation - gender (DISABLED - V12 STYLE)
            // ----------------------------------------
            if (false && game.phase === 'gender') {
                if (cmd.includes('dude') || (cmd.includes('male') && !cmd.includes('female'))) {
                    game.player.gender = 'male';
                    speak('Very well! Now, what is your race? Choose from human, elf, dwarf, orc, or halfling.');
                    game.phase = 'race';
                    return;
                }

                if (cmd.includes('chick') || cmd.includes('female')) {
                    game.player.gender = 'female';
                    speak('Very well! Now, what is your race? Choose from human, elf, dwarf, orc, or halfling.');
                    game.phase = 'race';
                    return;
                }

                if (cmd.includes('non') || cmd.includes('binary') || cmd.includes('neutral') || cmd.includes('they')) {
                    game.player.gender = 'nonbinary';
                    speak('Very well! Now, what is your race? Choose from human, elf, dwarf, orc, or halfling.');
                    game.phase = 'race';
                    return;
                }

                speak('Please choose dude for male, chick for female, or non-binary.');
                return;
            }
            
            // ----------------------------------------
            // PHASE: Character creation - race (DISABLED - V12 STYLE)
            // ----------------------------------------
            if (false && game.phase === 'race') {
                let selectedRace = null;
                
                if (cmd.includes('human')) selectedRace = 'human';
                else if (cmd.includes('elf')) selectedRace = 'elf';
                else if (cmd.includes('dwarf')) selectedRace = 'dwarf';
                else if (cmd.includes('orc')) selectedRace = 'orc';
                else if (cmd.includes('halfling') || cmd.includes('hobbit')) selectedRace = 'halfling';
                
                if (!selectedRace) {
                    speakSequence([
                        'Please choose a race.',
                        'Human: balanced and versatile.',
                        'Elf: graceful, bonus to dexterity and wisdom.',
                        'Dwarf: sturdy, bonus to strength.',
                        'Orc: powerful, large bonus to strength.',
                        'Halfling: lucky, bonus to dexterity and dodge chance.'
                    ]);
                    return;
                }
                
                game.player.race = selectedRace;
                const raceData = races[selectedRace];
                
                speakSequence([
                    `${raceData.name}! ${raceData.description}.`,
                    'Finally, choose your class.',
                    'Warrior: strong and tough, uses shields and heavy weapons.',
                    'Mage: master of arcane magic, powerful spells.',
                    'Rogue: quick and deadly, strikes from the shadows.'
                ]);
                
                game.phase = 'class';
                return;
            }
            
            // ----------------------------------------
            // PHASE: Character creation - class (DISABLED - V12 STYLE)
            // ----------------------------------------
            if (false && game.phase === 'class') {
                let selectedClass = null;
                
                if (cmd.includes('warrior') || cmd.includes('fighter') || cmd.includes('knight')) {
                    selectedClass = 'warrior';
                } else if (cmd.includes('mage') || cmd.includes('wizard') || cmd.includes('sorcerer')) {
                    selectedClass = 'mage';
                } else if (cmd.includes('rogue') || cmd.includes('thief') || cmd.includes('assassin')) {
                    selectedClass = 'rogue';
                }
                
                if (!selectedClass) {
                    speak('Please choose warrior, mage, or rogue.');
                    return;
                }
                
                game.player.class = selectedClass;
                initializeCharacter();
                return;
            }
            
            // ----------------------------------------
            // PHASE: Defending in combat - potion choice
            // ----------------------------------------
            if (game.phase === 'defending') {
                processDefendChoice(cmd);
                return;
            }
            
            // ----------------------------------------
            // PHASE: Dead
            // ----------------------------------------
            if (game.phase === 'dead') {
                // Reset for new game
                game.started = false;
                game.initialized = false;
                game.phase = 'init';
                game.player = createFreshPlayer();

                if (cmd.includes('load')) {
                    const loadMatch = cmd.replace('load', '').replace('game', '').trim();
                    if (loadMatch) {
                        loadGame(loadMatch);
                    } else {
                        loadGame();
                    }
                    return;
                }

                // Direct class selection - V12 style
                if (cmd.includes('warrior') || cmd.includes('fighter') || cmd.includes('knight')) {
                    selectClassV12('warrior');
                    return;
                }
                if (cmd.includes('mage') || cmd.includes('wizard') || cmd.includes('sorcerer')) {
                    selectClassV12('mage');
                    return;
                }
                if (cmd.includes('rogue') || cmd.includes('thief') || cmd.includes('assassin')) {
                    selectClassV12('rogue');
                    return;
                }
                if (cmd.includes('ranger') || cmd.includes('archer') || cmd.includes('hunter')) {
                    selectClassV12('ranger');
                    return;
                }
                if (cmd.includes('cleric') || cmd.includes('priest') || cmd.includes('healer')) {
                    selectClassV12('cleric');
                    return;
                }
                
                speak('Choose a class: Warrior, Mage, Rogue, Ranger, or Cleric. Or say load game.');
                return;
            }
            
            // ----------------------------------------
            // PHASE: Merchant
            // ----------------------------------------
            if (game.phase === 'merchant' || game.merchantOpen) {
                if (cmd.includes('leave') || cmd.includes('exit') || cmd.includes('goodbye') || cmd.includes('bye')) {
                    leaveMerchant();
                    return;
                }
                
                if (cmd.includes('what do you have') || cmd.includes('show') || cmd.includes('stock') || cmd.includes('wares') || cmd.includes('browse')) {
                    merchantListItems();
                    return;
                }
                
                if (cmd.includes('purchase') || cmd.includes('buy')) {
                    merchantPurchase(cmd);
                    return;
                }
                
                if (cmd.includes('sell')) {
                    merchantSellJunk();
                    return;
                }
                
                speak('Say what do you have, purchase followed by item name, sell junk, or leave.');
                return;
            }
            
            // ----------------------------------------
            // PHASE: Combat
            // ----------------------------------------
            if (game.combat) {
                if (cmd.includes('attack') || cmd.includes('hit') || cmd.includes('strike')) {
                    playerAttack();
                    return;
                }
                
                if (cmd.includes('defend') || cmd.includes('block') || cmd.includes('brace')) {
                    playerDefend();
                    return;
                }
                
                if (cmd.includes('special') || cmd.includes('ability') || cmd.includes('skill')) {
                    playerSpecial();
                    return;
                }
                
                if (cmd.includes('flee') || cmd.includes('run') || cmd.includes('escape')) {
                    attemptFlee();
                    return;
                }
                
                if (cmd.includes('cast')) {
                    castSpell(cmd);
                    return;
                }
                
                for (let ability of game.player.learnedAbilities) {
                    if (cmd.includes(ability.toLowerCase())) {
                        castSpell(cmd);
                        return;
                    }
                }
                
                if (cmd.includes('status') || cmd.includes('health')) {
                    speak(`Health: ${game.player.health} of ${game.player.maxHealth}. Mana: ${game.player.mana} of ${game.player.maxMana}. Enemy health: ${game.combat.enemy.health}.`);
                    return;
                }
                
                speak('In combat! Say attack, defend, special, cast spell name, or flee.');
                return;
            }
            
            // ----------------------------------------
            // EXPLORATION COMMANDS
            // ----------------------------------------
            
            // Movement
            if (cmd.includes('north') || cmd === 'up') {
                movePlayer('north');
                return;
            }
            if (cmd.includes('south') || cmd === 'down') {
                movePlayer('south');
                return;
            }
            if (cmd.includes('east') || cmd === 'right') {
                movePlayer('east');
                return;
            }
            if (cmd.includes('west') || cmd === 'left') {
                movePlayer('west');
                return;
            }
            
            // Room interactions
            if (cmd.includes('open') && cmd.includes('chest')) {
                openChest();
                return;
            }
            
            if (cmd.includes('look') || cmd.includes('search') || cmd.includes('examine')) {
                lookAround();
                return;
            }
            
            if ((cmd.includes('drink') && cmd.includes('fountain')) || cmd.includes('use fountain')) {
                useFountain();
                return;
            }
            
            if (cmd.includes('use') && cmd.includes('shrine')) {
                useShrine();
                return;
            }
            
            if ((cmd.includes('use') && cmd.includes('stair')) || cmd.includes('go down') || cmd.includes('descend')) {
                useStairs();
                return;
            }
            
            if (cmd.includes('merchant') || cmd.includes('shop') || cmd.includes('talk') || cmd.includes('trade')) {
                openMerchant();
                return;
            }
            
            // Inventory and equipment
            if (cmd.includes('inventory') || cmd.includes('bag') || cmd.includes('items')) {
                if (cmd.includes('junk')) {
                    viewJunkBag();
                } else {
                    viewInventory();
                }
                return;
            }
            
            if (cmd.includes('junk bag') || (cmd.includes('junk') && !cmd.includes('equip'))) {
                viewJunkBag();
                return;
            }
            
            if (cmd.includes('equip')) {
                const equipMatch = cmd.replace('equip', '').trim();
                if (equipMatch) {
                    for (let item of game.player.inventory) {
                        if (item.toLowerCase().includes(equipMatch) || equipMatch.includes(item.toLowerCase())) {
                            equipItem(item);
                            return;
                        }
                    }
                    speak(`Cannot find ${equipMatch} in your inventory.`);
                } else {
                    speak('Say equip followed by the item name.');
                }
                return;
            }
            
            if (cmd.includes('remove') || cmd.includes('unequip')) {
                if (cmd.includes('weapon') || cmd.includes('sword') || cmd.includes('staff') || cmd.includes('dagger')) {
                    removeEquipment('weapon');
                } else if (cmd.includes('armor') || cmd.includes('robe') || cmd.includes('mail')) {
                    removeEquipment('armor');
                } else if (cmd.includes('shield')) {
                    removeEquipment('shield');
                } else if (cmd.includes('helmet') || cmd.includes('helm') || cmd.includes('hat') || cmd.includes('crown')) {
                    removeEquipment('helmet');
                } else if (cmd.includes('glove') || cmd.includes('gauntlet')) {
                    removeEquipment('gloves');
                } else if (cmd.includes('boot') || cmd.includes('shoe') || cmd.includes('greave')) {
                    removeEquipment('boots');
                } else if (cmd.includes('ring')) {
                    removeEquipment('ring');
                } else if (cmd.includes('bracelet')) {
                    removeEquipment('bracelet');
                } else if (cmd.includes('amulet') || cmd.includes('necklace')) {
                    removeEquipment('amulet');
                } else {
                    speak('Say remove followed by weapon, armor, shield, helmet, gloves, boots, ring, bracelet, or amulet.');
                }
                return;
            }
            
            if (cmd.includes('inspect') || cmd.includes('look at')) {
                const inspectMatch = cmd.replace('inspect', '').replace('look at', '').trim();
                if (inspectMatch) {
                    const allItems = [...game.player.inventory, ...game.player.junkBag];
                    for (let item of allItems) {
                        if (item.toLowerCase().includes(inspectMatch) || inspectMatch.includes(item.toLowerCase())) {
                            inspectItem(item);
                            return;
                        }
                    }
                    speak(`Cannot find ${inspectMatch}.`);
                } else {
                    speak('Say inspect followed by an item name.');
                }
                return;
            }
            
            if (cmd.includes('junk') && !cmd.includes('bag') && !cmd.includes('sell')) {
                const junkMatch = cmd.replace('junk', '').trim();
                if (junkMatch) {
                    for (let item of game.player.inventory) {
                        if (item.toLowerCase().includes(junkMatch)) {
                            junkItem(item);
                            return;
                        }
                    }
                    speak(`Cannot find ${junkMatch} in your inventory.`);
                } else {
                    speak('Say junk followed by the item name to move it to your junk bag.');
                }
                return;
            }
            
            // Potions
            if (cmd.includes('health') && cmd.includes('potion')) {
                usePotion('health');
                return;
            }
            if (cmd.includes('mana') && cmd.includes('potion')) {
                usePotion('mana');
                return;
            }
            
            // Read book
            if (cmd.includes('read') && (cmd.includes('book') || cmd.includes('tome') || cmd.includes('scroll'))) {
                readBook(cmd);
                return;
            }
            
            // Attributes
            if (cmd.includes('strength') && !cmd.includes('potion')) {
                if (game.player.unspentAttributePoints > 0) {
                    allocateAttributePoint('strength');
                } else {
                    speak(`Your strength is ${game.player.strength}. You have no attribute points to spend.`);
                }
                return;
            }
            if (cmd.includes('dexterity')) {
                if (game.player.unspentAttributePoints > 0) {
                    allocateAttributePoint('dexterity');
                } else {
                    speak(`Your dexterity is ${game.player.dexterity}. You have no attribute points to spend.`);
                }
                return;
            }
            if (cmd.includes('wisdom')) {
                if (game.player.unspentAttributePoints > 0) {
                    allocateAttributePoint('wisdom');
                } else {
                    speak(`Your wisdom is ${game.player.wisdom}. You have no attribute points to spend.`);
                }
                return;
            }
            if (cmd.includes('attribute') || cmd.includes('stats')) {
                speak(`Strength ${game.player.strength}, Dexterity ${game.player.dexterity}, Wisdom ${game.player.wisdom}. You have ${game.player.unspentAttributePoints} points to spend.`);
                return;
            }
            
            // Status and info
            if (cmd.includes('status') || cmd.includes('character') || cmd.includes('who am i')) {
                checkStatus();
                return;
            }
            
            if (cmd.includes('help')) {
                showHelp();
                return;
            }
            
            if (cmd.includes('tip')) {
                showTip();
                return;
            }
            
            if (cmd.includes('readme') || cmd.includes('about') || cmd.includes('how to play')) {
                speak(gameInfo.readme);
                return;
            }
            
            if (cmd.includes('license') || cmd.includes('credit') || cmd.includes('copyright')) {
                speak(gameInfo.license);
                return;
            }
            
            // Save/Load
            if (cmd.includes('save')) {
                const saveName = cmd.replace('save', '').replace('game', '').trim();
                saveGame(saveName || null);
                return;
            }
            
            if (cmd.includes('load')) {
                const loadName = cmd.replace('load', '').replace('game', '').trim();
                loadGame(loadName || null);
                return;
            }
            
            if (cmd.includes('list') && cmd.includes('save')) {
                listSavedCharacters();
                return;
            }
            
            if (cmd.includes('delete') && cmd.includes('save')) {
                const deleteName = cmd.replace('delete', '').replace('save', '').trim();
                deleteSave(deleteName);
                return;
            }
            
            // Unknown command
            speak('I did not understand that command. Say help for a list of commands.');
        }

        // ------------------------------------------------------------
        // SECTION 86: CREATE FRESH PLAYER
        // Returns a new player object
        // ------------------------------------------------------------
        
        function createFreshPlayer() {
            return {
                name: '',
                class: '',
                race: '',
                gender: '',
                level: 1,
                experience: 0,
                experienceToNext: 100,
                health: 100,
                maxHealth: 100,
                mana: 50,
                maxMana: 50,
                gold: 25,
                strength: 10,
                dexterity: 10,
                wisdom: 10,
                unspentAttributePoints: 0,
                critChance: 0,
                dodgeChance: 0,
                baseAttack: 10,
                defense: 0,
                weapon: '',
                armor: '',
                shield: '',
                helmet: '',
                gloves: '',
                boots: '',
                equippedRings: [],
                equippedBracelets: [],
                equippedAmulet: '',
                inventory: [],
                junkBag: [],
                learnedAbilities: [],
                specialItems: [],
                activeEffects: [],
                position: { x: 6, y: 6 },
                damageMultiplier: 1,
                defenseMultiplier: 1,
                manaMultiplier: 1,
                roomsExplored: 0
            };
        }

        // ------------------------------------------------------------
        // SECTION 87: INITIALIZE CHARACTER
        // Sets up new character with class stats and equipment
        // ------------------------------------------------------------
        
        function initializeCharacter() {
            const classData = classes[game.player.class];
            const raceData = races[game.player.race];
            
            // Apply class base stats
            game.player.health = classData.health;
            game.player.maxHealth = classData.maxHealth;
            game.player.mana = classData.mana;
            game.player.maxMana = classData.maxMana;
            game.player.gold = classData.gold;
            
            // Apply class base attributes
            game.player.strength = classData.baseStrength;
            game.player.dexterity = classData.baseDexterity;
            game.player.wisdom = classData.baseWisdom;
            
            // Apply race bonuses
            game.player.strength += raceData.bonuses.strength;
            game.player.dexterity += raceData.bonuses.dexterity;
            game.player.wisdom += raceData.bonuses.wisdom;
            
            // Equip starting gear
            game.player.weapon = classData.startWeapon;
            game.player.armor = classData.startArmor;
            if (classData.startShield) {
                game.player.shield = classData.startShield;
            }
            
            // Add starting items to inventory
            for (let item of classData.items) {
                if (item !== classData.startWeapon && item !== classData.startArmor && item !== classData.startShield) {
                    game.player.inventory.push(item);
                }
            }
            
            // Calculate derived stats
            calculateDerivedStats();
            updateDefense();
            
            // Mark as initialized
            game.initialized = true;
            game.phase = 'exploration';
            
            // Generate dungeon
            generateDungeon();
            
            // Welcome message
            speakSequence([
                `Excellent! ${game.player.name} the ${game.player.race} ${game.player.class} is ready for adventure!`,
                `You start with ${game.player.health} health, ${game.player.mana} mana, and ${game.player.gold} gold.`,
                `Your attributes are: Strength ${game.player.strength}, Dexterity ${game.player.dexterity}, Wisdom ${game.player.wisdom}.`,
                `You are equipped with ${game.player.weapon}${game.player.shield ? ' and ' + game.player.shield : ''}.`,
                `You stand at the entrance of the dungeon. A welcome chest awaits you!`,
                `The boss lurks in the far southeast corner at position 11, 11.`,
                `Tap anywhere and say help for commands. Good luck, brave hero!`
            ], () => {
                describeRoom();
            });
        }

        // ------------------------------------------------------------
        // SECTION 88: TAP ANYWHERE TO LISTEN
        // Full screen touch - blind first UI
        // ------------------------------------------------------------

        micButton.addEventListener('click', function(e) {
            e.preventDefault();
            startListening();
        });

        micButton.addEventListener('touchstart', function(e) {
            e.preventDefault();
            startListening();
        }, { passive: false });

        // ------------------------------------------------------------
        // SECTION 89: PREVENT UNWANTED BROWSER BEHAVIORS
        // ------------------------------------------------------------
        
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // SECTION 90: INITIAL PAGE LOAD
        // Speak welcome on first tap
        // ------------------------------------------------------------
        
        window.onload = function() {
            // Silent load - game speaks on first tap
        };

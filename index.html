        // Combat System, Victory, Experience, Leveling
        // ------------------------------------------------------------

        // ------------------------------------------------------------
        // SECTION 44: START COMBAT
        // Initializes combat state
        // ------------------------------------------------------------
        
        function startCombat() {
            const room = game.currentRoom;
            
            if (!room.enemy || room.enemy.health <= 0) {
                speak('There is nothing to fight here.');
                return;
            }
            
            game.combat = {
                enemy: room.enemy,
                secondEnemy: room.secondEnemy || null,
                turn: 'player',
                playerDefending: false,
                twoEnemyFight: room.secondEnemy && room.secondEnemy.health > 0,
                enemyStunned: false,
                enemyFrozen: false,
                enemyPoisoned: false,
                poisonDamage: 0,
                poisonTurns: 0,
                enemyMarked: false,
                playerInvisible: false,
                battleCryActive: false,
                battleCryTurns: 0,
                enemyWeakened: false,
                weakenTurns: 0
            };

            game.phase = 'combat';
        }

        // ------------------------------------------------------------
        // SECTION 45: PLAYER ATTACK
        // Basic attack with critical hit chance
        // ------------------------------------------------------------
        
        function playerAttack() {
            if (!game.combat) {
                speak('You are not in combat.');
                return;
            }

            // Calculate base damage
            let damage = calculateAttackDamage();
            
            // Add weapon damage
            const weaponData = equipment.weapons.find(w => w.name === game.player.weapon);
            if (weaponData) {
                damage += weaponData.attack;
            }
            
            // Add glove attack bonus
            const gloveData = equipment.gloves.find(g => g.name === game.player.gloves);
            if (gloveData && gloveData.attack) {
                damage += gloveData.attack;
            }
            
            // Add bracelet attack bonuses
            for (let braceletName of game.player.equippedBracelets) {
                const braceletData = equipment.bracelets.find(b => b.name === braceletName);
                if (braceletData && braceletData.attack) {
                    damage += braceletData.attack;
                }
            }
            
            // Add ring attack bonuses
            for (let ringName of game.player.equippedRings) {
                const ringData = rings.find(r => r.name === ringName);
                if (ringData && ringData.stat === 'attack') {
                    damage += ringData.value;
                }
            }
            
            // Add amulet attack bonus
            if (game.player.equippedAmulet) {
                const amuletData = amulets.find(a => a.name === game.player.equippedAmulet);
                if (amuletData && amuletData.stat === 'attack') {
                    damage += amuletData.value;
                }
            }
            
            // Battle Cry buff (+50% damage)
            if (game.combat.battleCryActive) {
                damage = Math.floor(damage * 1.5);
            }
            
            // Invisibility from Shadowmeld (double damage)
            if (game.combat.playerInvisible) {
                damage = Math.floor(damage * 2);
                game.combat.playerInvisible = false;
            }
            
            // Enemy marked takes 50% more damage
            if (game.combat.enemyMarked) {
                damage = Math.floor(damage * 1.5);
            }
            
            // Check for critical hit
            const isCrit = rollCriticalHit();
            if (isCrit) {
                damage = Math.floor(damage * 2);
            }
            
            // Apply damage to enemy
            game.combat.enemy.health -= damage;
            
            let messages = [];
            
            if (isCrit) {
                messages.push(`Critical hit! You strike with devastating force for ${damage} damage!`);
            } else {
                messages.push(`You attack the ${game.combat.enemy.name} for ${damage} damage.`);
            }
            
            // Lifesteal from Ring of Vampirism
            const vampireRing = game.player.equippedRings.find(r => r === 'Ring of Vampirism');
            if (vampireRing) {
                const healAmount = Math.floor(damage * 0.1);
                game.player.health = Math.min(game.player.maxHealth, game.player.health + healAmount);
                messages.push(`Your vampiric ring heals you for ${healAmount} health.`);
            }
            
            // Check if enemy defeated
            if (game.combat.enemy.health <= 0) {
                messages.push(`The ${game.combat.enemy.name} is defeated!`);
                
                // Check for second enemy
                if (game.combat.twoEnemyFight && game.combat.secondEnemy && game.combat.secondEnemy.health > 0) {
                    game.combat.enemy = game.combat.secondEnemy;
                    game.combat.secondEnemy = null;
                    messages.push(`But another ${game.combat.enemy.name} remains with ${game.combat.enemy.health} health!`);
                    speakSequence(messages, () => {
                        enemyTurn();
                    });
                    return;
                }
                
                speakSequence(messages, () => {
                    combatVictory();
                });
                return;
            }
            
            messages.push(`${game.combat.enemy.name} has ${game.combat.enemy.health} health remaining.`);
            
            speakSequence(messages, () => {
                enemyTurn();
            });
        }

        // ------------------------------------------------------------
        // SECTION 46: PLAYER DEFEND
        // Reduces damage and offers potion choice
        // ------------------------------------------------------------
        
        function playerDefend() {
            if (!game.combat) {
                speak('You are not in combat.');
                return;
            }

            game.combat.playerDefending = true;
            game.phase = 'defending';
            
            speak('You brace for impact, reducing damage by half. You have a moment to drink a potion. Say health potion, mana potion, or brace to continue.');
        }

        // ------------------------------------------------------------
        // SECTION 47: PROCESS DEFEND CHOICE
        // Handles potion use during defend or continuing
        // ------------------------------------------------------------
        
        function processDefendChoice(command) {
            if (command.includes('health') && command.includes('potion')) {
                // Find best health potion
                const potionOrder = ['Ultimate Health Potion', 'Supreme Health Potion', 'Greater Health Potion', 'Health Potion'];
                let usedPotion = null;
                
                for (let potionName of potionOrder) {
                    if (command.includes(potionName.toLowerCase()) || 
                        (command.includes('health') && game.player.inventory.includes(potionName))) {
                        const index = game.player.inventory.indexOf(potionName);
                        if (index !== -1) {
                            usedPotion = potionName;
                            game.player.inventory.splice(index, 1);
                            break;
                        }
                    }
                }
                
                // If specific potion not found, try to find any health potion
                if (!usedPotion) {
                    for (let potionName of potionOrder) {
                        const index = game.player.inventory.indexOf(potionName);
                        if (index !== -1) {
                            usedPotion = potionName;
                            game.player.inventory.splice(index, 1);
                            break;
                        }
                    }
                }
                
                if (!usedPotion) {
                    speak('You have no health potions! Say mana potion or brace to continue.');
                    return;
                }
                
                // Apply healing
                const potionData = merchantItems.find(p => p.name === usedPotion);
                const healing = potionData ? potionData.healing : 50;
                game.player.health = Math.min(game.player.maxHealth, game.player.health + healing);
                
                speak(`You quickly drink a ${usedPotion}, restoring ${healing} health. Your health is now ${game.player.health}.`, () => {
                    game.phase = 'combat';
                    enemyTurn();
                });
                
            } else if (command.includes('mana') && command.includes('potion')) {
                // Find best mana potion
                const potionOrder = ['Ultimate Mana Potion', 'Supreme Mana Potion', 'Greater Mana Potion', 'Mana Potion'];
                let usedPotion = null;
                
                for (let potionName of potionOrder) {
                    const index = game.player.inventory.indexOf(potionName);
                    if (index !== -1) {
                        usedPotion = potionName;
                        game.player.inventory.splice(index, 1);
                        break;
                    }
                }
                
                if (!usedPotion) {
                    speak('You have no mana potions! Say health potion or brace to continue.');
                    return;
                }
                
                // Apply mana
                const potionData = merchantItems.find(p => p.name === usedPotion);
                const manaRestore = potionData ? potionData.mana : 40;
                game.player.mana = Math.min(game.player.maxMana, game.player.mana + manaRestore);
                
                speak(`You quickly drink a ${usedPotion}, restoring ${manaRestore} mana. Your mana is now ${game.player.mana}.`, () => {
                    game.phase = 'combat';
                    enemyTurn();
                });
                
            } else if (command.includes('brace') || command.includes('continue') || command.includes('ready') || command.includes('skip')) {
                speak('You steel yourself for the attack.', () => {
                    game.phase = 'combat';
                    enemyTurn();
                });
                
            } else {
                speak('Say health potion, mana potion, or brace to continue.');
            }
        }

        // ------------------------------------------------------------
        // SECTION 48: PLAYER SPECIAL ABILITY
        // Class-specific special attacks
        // ------------------------------------------------------------
        
        function playerSpecial() {
            if (!game.combat) {
                speak('You are not in combat.');
                return;
            }

            const classData = classes[game.player.class];
            const special = classData.special;
            const manaCost = adjustManaCost(special.cost);
            
            if (game.player.mana < manaCost) {
                speak(`Not enough mana for ${special.name}. You need ${manaCost} mana but only have ${game.player.mana}. Try defending to drink a mana potion.`);
                return;
            }
            
            game.player.mana -= manaCost;
            
            let damage = special.damage;
            let messages = [];
            
            // WARRIOR - SHIELD BASH
            if (game.player.class === 'warrior') {
                // Add shield defense to damage
                const shieldData = equipment.shields.find(s => s.name === game.player.shield);
                if (shieldData) {
                    damage += shieldData.defense;
                }
                
                damage = Math.floor(damage * game.player.damageMultiplier);
                
                // Apply damage and stun
                game.combat.enemy.health -= damage;
                game.combat.enemyStunned = true;
                
                messages.push(`You bash the ${game.combat.enemy.name} with your shield for ${damage} damage!`);
                messages.push(`The enemy is stunned and will skip their next turn!`);
            }
            
            // ROGUE - BACKSTAB
            else if (game.player.class === 'rogue') {
                damage = calculateSpellDamage(damage);
                
                // Backstab from shadows - no retaliation
                game.combat.enemy.health -= damage;
                
                messages.push(`You strike from the shadows for ${damage} damage!`);
                messages.push(`The ${game.combat.enemy.name} cannot retaliate against your sneak attack!`);
                
                if (game.combat.enemy.health <= 0) {
                    messages.push(`The ${game.combat.enemy.name} is defeated!`);
                    speakSequence(messages, () => {
                        combatVictory();
                    });
                    return;
                }
                
                messages.push(`${game.combat.enemy.name} has ${game.combat.enemy.health} health remaining.`);
                speakSequence(messages);
                return; // No enemy turn after backstab
            }
            
            // MAGE - FIREBALL
            else if (game.player.class === 'mage') {
                damage = calculateSpellDamage(damage);
                
                game.combat.enemy.health -= damage;
                
                messages.push(`You hurl a massive fireball for ${damage} damage!`);
            }
            
            // Check if enemy defeated
            if (game.combat.enemy.health <= 0) {
                messages.push(`The ${game.combat.enemy.name} is defeated!`);
                
                if (game.combat.twoEnemyFight && game.combat.secondEnemy && game.combat.secondEnemy.health > 0) {
                    game.combat.enemy = game.combat.secondEnemy;
                    game.combat.secondEnemy = null;
                    messages.push(`But another ${game.combat.enemy.name} remains with ${game.combat.enemy.health} health!`);
                    speakSequence(messages, () => {
                        enemyTurn();
                    });
                    return;
                }
                
                speakSequence(messages, () => {
                    combatVictory();
                });
                return;
            }
            
            messages.push(`${game.combat.enemy.name} has ${game.combat.enemy.health} health remaining.`);
            
            speakSequence(messages, () => {
                enemyTurn();
            });
        }

        // ------------------------------------------------------------
        // SECTION 49: CAST LEARNED SPELL
        // Use abilities learned from books
        // ------------------------------------------------------------
        
        function castSpell(command) {
            if (!game.combat) {
                speak('You can only cast spells in combat.');
                return;
            }

            // Find which spell was mentioned
            let spellToCast = null;
            for (let ability of abilities) {
                if (command.includes(ability.name.toLowerCase())) {
                    spellToCast = ability;
                    break;
                }
            }
            
            if (!spellToCast) {
                const learned = game.player.learnedAbilities.join(', ');
                if (learned) {
                    speak(`Spell not recognized. You know: ${learned}. Say cast followed by the spell name.`);
                } else {
                    speak('You have not learned any spells yet. Find ability books in treasure chests.');
                }
                return;
            }
            
            if (!game.player.learnedAbilities.includes(spellToCast.name)) {
                speak(`You have not learned ${spellToCast.name} yet. Find its book in a treasure chest.`);
                return;
            }
            
            const manaCost = adjustManaCost(spellToCast.cost);
            
            if (game.player.mana < manaCost) {
                speak(`Not enough mana. ${spellToCast.name} costs ${manaCost} mana but you only have ${game.player.mana}. Try defending to drink a mana potion.`);
                return;
            }
            
            game.player.mana -= manaCost;
            
            let damage = calculateSpellDamage(spellToCast.damage);
            let messages = [];
            
            // Handle different spell types
            switch (spellToCast.type) {
                case 'freeze':
                    game.combat.enemy.health -= damage;
                    game.combat.enemyFrozen = true;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
                    messages.push(`The ${game.combat.enemy.name} is frozen solid and cannot act!`);
                    break;
                    
                case 'stun':
                    game.combat.enemy.health -= damage;
                    game.combat.enemyStunned = true;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
                    messages.push(`The ${game.combat.enemy.name} is stunned!`);
                    break;
                    
                case 'poison':
                    game.combat.enemy.health -= damage;
                    game.combat.enemyPoisoned = true;
                    game.combat.poisonDamage = 15 + game.player.level;
                    game.combat.poisonTurns = spellToCast.duration || 3;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
                    messages.push(`The ${game.combat.enemy.name} is poisoned and will take ${game.combat.poisonDamage} damage each turn!`);
                    break;
                    
                case 'sneak':
                    game.combat.enemy.health -= damage;
                    messages.push(`You strike from the shadows for ${damage} damage!`);
                    messages.push(`The enemy cannot retaliate!`);
                    
                    if (game.combat.enemy.health <= 0) {
                        messages.push(`The ${game.combat.enemy.name} is defeated!`);
                        speakSequence(messages, () => combatVictory());
                        return;
                    }
                    messages.push(`${game.combat.enemy.name} has ${game.combat.enemy.health} health remaining.`);
                    speakSequence(messages);
                    return; // No enemy turn
                    
                case 'timestop':
                    game.combat.enemyFrozen = true;
                    game.combat.enemyStunned = true;
                    messages.push(`You cast ${spellToCast.name}! Time freezes around your enemy!`);
                    messages.push(`The ${game.combat.enemy.name} is frozen in time for 2 turns!`);
                    speakSequence(messages);
                    return; // No enemy turn
                    
                case 'vanish':
                    game.combat.playerInvisible = true;
                    messages.push(`You cast ${spellToCast.name} and fade into the shadows!`);
                    messages.push(`Your next attack will deal double damage!`);
                    speakSequence(messages, () => enemyTurn());
                    return;
                    
                case 'mark':
                    game.combat.enemy.health -= damage;
                    game.combat.enemyMarked = true;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
                    messages.push(`The ${game.combat.enemy.name} is marked and will take 50% more damage!`);
                    break;
                    
                case 'rage':
                    // Triple attack
                    const tripleHit = damage * 3;
                    game.combat.enemy.health -= tripleHit;
                    messages.push(`You unleash ${spellToCast.name}! Three devastating strikes for ${tripleHit} total damage!`);
                    break;
                    
                case 'lifesteal':
                    game.combat.enemy.health -= damage;
                    const healAmount = Math.floor(damage * 0.5);
                    game.player.health = Math.min(game.player.maxHealth, game.player.health + healAmount);
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage and heal for ${healAmount}!`);
                    break;
                    
                case 'heal':
                    const healing = spellToCast.healing || 100;
                    game.player.health = Math.min(game.player.maxHealth, game.player.health + healing);
                    messages.push(`You cast ${spellToCast.name} and restore ${healing} health! Your health is now ${game.player.health}.`);
                    speakSequence(messages, () => enemyTurn());
                    return;
                    
                case 'buff':
                    game.combat.battleCryActive = true;
                    game.combat.battleCryTurns = 3;
                    messages.push(`You unleash a mighty ${spellToCast.name}! Your damage is increased by 50% for 3 turns!`);
                    speakSequence(messages, () => enemyTurn());
                    return;
                    
                case 'weaken':
                    game.combat.enemy.health -= damage;
                    game.combat.enemyWeakened = true;
                    game.combat.weakenTurns = 3;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
                    messages.push(`The ${game.combat.enemy.name}'s attacks are weakened by 30% for 3 turns!`);
                    break;
                    
                case 'escape':
                    messages.push(`You throw down a ${spellToCast.name} and vanish in the smoke!`);
                    speakSequence(messages, () => {
                        game.combat = null;
                        game.phase = 'exploration';
                        speak('You escaped successfully! The enemy remains in this room.');
                    });
                    return;
                    
                default:
                    game.combat.enemy.health -= damage;
                    messages.push(`You cast ${spellToCast.name} for ${damage} damage!`);
            }
            
            // Check if enemy defeated
            if (game.combat.enemy.health <= 0) {
                messages.push(`The ${game.combat.enemy.name} is defeated!`);
                
                if (game.combat.twoEnemyFight && game.combat.secondEnemy && game.combat.secondEnemy.health > 0) {
                    game.combat.enemy = game.combat.secondEnemy;
                    game.combat.secondEnemy = null;
                    messages.push(`But another enemy remains!`);
                    speakSequence(messages, () => enemyTurn());
                    return;
                }
                
                speakSequence(messages, () => combatVictory());
                return;
            }
            
            messages.push(`${game.combat.enemy.name} has ${game.combat.enemy.health} health remaining.`);
            
            speakSequence(messages, () => enemyTurn());
        }

        // ------------------------------------------------------------
        // SECTION 50: ENEMY TURN
        // Enemy attacks player, handles regeneration and status effects
        // ------------------------------------------------------------
        
        function enemyTurn() {
            if (!game.combat || !game.combat.enemy) {
                game.phase = 'exploration';
                return;
            }
            
            let messages = [];
            
            // Ring of Regeneration healing at start of each turn
            const regenRings = game.player.equippedRings.filter(r => r === 'Ring of Regeneration');
            if (regenRings.length > 0) {
                const regenAmount = regenRings.length * 50;
                const oldHealth = game.player.health;
                game.player.health = Math.min(game.player.maxHealth, game.player.health + regenAmount);
                const actualHeal = game.player.health - oldHealth;
                if (actualHeal > 0) {
                    messages.push(`Your Ring${regenRings.length > 1 ? 's' : ''} of Regeneration heal${regenRings.length === 1 ? 's' : ''} you for ${actualHeal} health.`);
                }
            }
            
            // Apply poison damage to enemy
            if (game.combat.enemyPoisoned && game.combat.poisonTurns > 0) {
                game.combat.enemy.health -= game.combat.poisonDamage;
                game.combat.poisonTurns--;
                messages.push(`Poison deals ${game.combat.poisonDamage} damage to the ${game.combat.enemy.name}.`);
                
                if (game.combat.enemy.health <= 0) {
                    messages.push(`The ${game.combat.enemy.name} succumbs to poison!`);
                    speakSequence(messages, () => combatVictory());
                    return;
                }
                
                if (game.combat.poisonTurns === 0) {
                    game.combat.enemyPoisoned = false;
                    messages.push('The poison wears off.');
                }
            }
            
            // Enemy regeneration (trolls, etc.)
            if (game.combat.enemy.regenerate) {
                game.combat.enemy.health = Math.min(
                    game.combat.enemy.maxHealth || game.combat.enemy.health + 1000,
                    game.combat.enemy.health + game.combat.enemy.regenerate
                );
                messages.push(`The ${game.combat.enemy.name} regenerates ${game.combat.enemy.regenerate} health.`);
            }
            
            // Check if enemy is stunned or frozen
            if (game.combat.enemyStunned) {
                game.combat.enemyStunned = false;
                messages.push(`The ${game.combat.enemy.name} is stunned and cannot attack!`);
                speakSequence(messages, () => {
                    speak('What will you do? Attack, defend, special, or cast a spell.');
                });
                return;
            }
            
            if (game.combat.enemyFrozen) {
                game.combat.enemyFrozen = false;
                messages.push(`The ${game.combat.enemy.name} is frozen and cannot move!`);
                speakSequence(messages, () => {
                    speak('What will you do? Attack, defend, special, or cast a spell.');
                });
                return;
            }
            
            // Decrement buff timers
            if (game.combat.battleCryTurns > 0) {
                game.combat.battleCryTurns--;
                if (game.combat.battleCryTurns === 0) {
                    game.combat.battleCryActive = false;
                    messages.push('Your Battle Cry fades.');
                }
            }
            
            if (game.combat.weakenTurns > 0) {
                game.combat.weakenTurns--;
                if (game.combat.weakenTurns === 0) {
                    game.combat.enemyWeakened = false;
                    messages.push('The enemy recovers from weakness.');
                }
            }
            
            // Check for dodge
            if (rollDodge()) {
                messages.push(`The ${game.combat.enemy.name} attacks, but you nimbly dodge out of the way!`);
                speakSequence(messages, () => {
                    speak('What will you do? Attack, defend, special, or cast a spell.');
                });
                return;
            }
            
            // Calculate enemy damage
            let enemyDamage = game.combat.enemy.damage;
            
            // Reduce damage if player defending
            if (game.combat.playerDefending) {
                enemyDamage = Math.floor(enemyDamage * 0.5);
                game.combat.playerDefending = false;
            }
            
            // Reduce damage if enemy is weakened
            if (game.combat.enemyWeakened) {
                enemyDamage = Math.floor(enemyDamage * 0.7);
            }
            
            // Apply defense reduction
            const defenseReduction = Math.floor(game.player.defense * game.player.defenseMultiplier * 0.5);
            enemyDamage = Math.max(1, enemyDamage - defenseReduction);
            
            // Apply damage
            game.player.health -= enemyDamage;
            
            messages.push(`The ${game.combat.enemy.name} attacks you for ${enemyDamage} damage!`);
            messages.push(`Your health is ${game.player.health} of ${game.player.maxHealth}.`);
            
            // Check for player death
            if (game.player.health <= 0) {
                speakSequence(messages, () => {
                    playerDeath();
                });
                return;
            }
            
            // Low health warning
            if (game.player.health < game.player.maxHealth * 0.25) {
                messages.push('Warning! Your health is critically low!');
            }
            
            speakSequence(messages, () => {
                speak('What will you do? Attack, defend, special, or cast a spell.');
            });
        }

        // ------------------------------------------------------------
        // SECTION 51: ATTEMPT FLEE
        // Try to escape from combat
        // ------------------------------------------------------------
        
        function attemptFlee() {
            if (!game.combat) {
                speak('You are not in combat.');
                return;
            }
            
            const fleeChance = game.combat.enemy.fleeChance || 0.5;
            
            if (Math.random() < fleeChance) {
                speak('You successfully flee from combat! The enemy remains in this room.', () => {
                    game.combat = null;
                    game.phase = 'exploration';
                });
            } else {
                speak(`You try to flee but the ${game.combat.enemy.name} blocks your escape!`, () => {
                    enemyTurn();
                });
            }
        }

        // ------------------------------------------------------------
        // SECTION 52: COMBAT VICTORY
        // Rewards for defeating enemies
        // ------------------------------------------------------------
        
        function combatVictory() {
            let gold = game.combat.enemy.gold;
            let exp = game.combat.enemy.exp;
            
            // Lucky Coin bonus
            if (game.player.specialItems.includes("Merchant's Lucky Coin")) {
                gold = Math.floor(gold * 1.5);
            }
            
            // Ring of Fortune bonus
            const fortuneRings = game.player.equippedRings.filter(r => r === 'Ring of Fortune');
            if (fortuneRings.length > 0) {
                gold = Math.floor(gold * (1 + (fortuneRings.length * 0.25)));
            }
            
            // Double rewards for two-enemy fight
            if (game.combat.twoEnemyFight) {
                gold = Math.floor(gold * 1.5);
                exp = Math.floor(exp * 2);
            }
            
            game.player.gold += gold;
            
            // Mark room enemy as defeated
            if (game.currentRoom.enemy) {
                game.currentRoom.enemy.health = 0;
            }
            if (game.currentRoom.secondEnemy) {
                game.currentRoom.secondEnemy.health = 0;
            }
            
            let messages = [
                'Victory!',
                `You earned ${gold} gold and ${exp} experience!`
            ];
            
            if (game.combat.twoEnemyFight) {
                messages.push('Bonus rewards for defeating multiple enemies!');
            }
            
            // Clear combat effects
            game.combat = null;
            game.phase = 'exploration';

            speakSequence(messages, () => {
                gainExperience(exp);
                
                // Check for chest in room
                setTimeout(() => {
                    if (game.currentRoom.hasChest && !game.currentRoom.searched) {
                        speak('There is a chest here. Say open chest to loot it.');
                    } else if (game.currentRoom.type === 'boss') {
                        dungeonComplete();
                    } else {
                        speak('What will you do next?');
                    }
                }, 1000);
            });
        }

        // ------------------------------------------------------------
        // SECTION 53: GAIN EXPERIENCE
        // Awards XP and handles level up
        // ------------------------------------------------------------
        
        function gainExperience(amount) {
            // Crystal of Experience bonus
            if (game.player.specialItems.includes('Crystal of Experience')) {
                amount = Math.floor(amount * 2);
            }
            
            // Amulet of Experience bonus
            if (game.player.equippedAmulet === 'Amulet of Experience') {
                amount = Math.floor(amount * 1.2);
            }
            
            game.player.experience += amount;
            
            // Check for level up
            while (game.player.experience >= game.player.experienceToNext) {
                levelUp();
            }
        }

        // ------------------------------------------------------------
        // SECTION 54: LEVEL UP
        // Increases stats and grants attribute points
        // ------------------------------------------------------------
        
        function levelUp() {
            game.player.level++;
            game.player.experience -= game.player.experienceToNext;
            game.player.experienceToNext = Math.floor(game.player.experienceToNext * 1.5);
            
            // Grant 3 attribute points
            game.player.unspentAttributePoints += 3;
            
            // Recalculate derived stats
            calculateDerivedStats();
            
            // Full heal on level up
            game.player.health = game.player.maxHealth;
            game.player.mana = game.player.maxMana;
            
            speakSequence([
                `Congratulations! You have reached level ${game.player.level}!`,
                `Your health and mana are fully restored!`,
                `You have ${game.player.unspentAttributePoints} attribute points to spend.`,
                `Say strength, dexterity, or wisdom to allocate them.`
            ]);
        }

        // ------------------------------------------------------------
        // SECTION 55: PLAYER DEATH
        // Handles game over
        // ------------------------------------------------------------
        
        function playerDeath() {
            // Check for Elixir of Immortality
            const elixirIndex = game.player.activeEffects.findIndex(e => e.type === 'revive');
            
            if (elixirIndex !== -1) {
                game.player.activeEffects.splice(elixirIndex, 1);
                game.player.health = Math.floor(game.player.maxHealth * 0.5);
                
                speak('The Elixir of Immortality saves you from death! You are revived with half health!', () => {
                    speak('What will you do? Attack, defend, special, or cast a spell.');
                });
                return;
            }
            
            game.combat = null;
            game.phase = 'dead';

            speakSequence([
                'You have fallen in battle.',
                `You reached level ${game.player.level} on dungeon floor ${game.dungeon.currentLevel}.`,
                'Your adventure ends here, brave hero.',
                'Choose a class to start a new game: Warrior, Mage, Rogue, Ranger, or Cleric.',
                'Or say load game to continue a saved character.'
            ]);
        }

                'Greater challenges and rewards await below!'
            ]);
        }

        // ------------------------------------------------------------
        // SECTION 57: ADD ITEM TO INVENTORY
        // Filters items to correct location (inventory or junk bag)
        // ------------------------------------------------------------
        
        function addItemToInventory(itemName) {
            // Check if it's a treasure - always goes to junk bag
            const treasureItem = treasures.find(t => t.name === itemName);
            if (treasureItem) {
                game.player.junkBag.push(itemName);
                return { location: 'junk', reason: 'treasure' };
            }
            
            // Check if it's a potion - always goes to inventory (unlimited)
            if (itemName.includes('Potion') || itemName.includes('Elixir')) {
                game.player.inventory.push(itemName);
                return { location: 'inventory', reason: 'potion' };
            }
            
            // Check if it's an ability book - goes to inventory
            if (itemName.includes('Book of') || itemName.includes('Tome of') || itemName.includes('Scroll of')) {
                game.player.inventory.push(itemName);
                return { location: 'inventory', reason: 'book' };
            }
            
            // Check if it's Ring of Regeneration - special handling
            if (itemName === 'Ring of Regeneration') {
                game.player.inventory.push(itemName);
                return { location: 'inventory', reason: 'ring' };
            }
            
            // Check if it's a ring
            const ringItem = rings.find(r => r.name === itemName);
            if (ringItem) {
                // Count how many of this ring we already have
                const inInventory = game.player.inventory.filter(i => i === itemName).length;
                const equipped = game.player.equippedRings.filter(r => r === itemName).length;
                const total = inInventory + equipped;
                
                if (total < 2) {
                    game.player.inventory.push(itemName);
                    return { location: 'inventory', reason: 'ring' };
                } else {
                    game.player.junkBag.push(itemName);
                    return { location: 'junk', reason: 'duplicate ring' };
                }
            }
            
            // Check if it's a bracelet
            const braceletItem = equipment.bracelets.find(b => b.name === itemName);
            if (braceletItem) {
                // Check if we already have this bracelet
                const inInventory = game.player.inventory.includes(itemName);
                const equipped = game.player.equippedBracelets.includes(itemName);
                
                if (!inInventory && !equipped) {
                    game.player.inventory.push(itemName);
                    return { location: 'inventory', reason: 'bracelet' };
                } else {
                    game.player.junkBag.push(itemName);
                    return { location: 'junk', reason: 'duplicate bracelet' };
                }
            }
            
            // Check if it's an amulet
            const amuletItem = amulets.find(a => a.name === itemName);
            if (amuletItem) {
                // Check if we already have this amulet
                const inInventory = game.player.inventory.includes(itemName);
                const equipped = game.player.equippedAmulet === itemName;
                
                if (!inInventory && !equipped) {
                    game.player.inventory.push(itemName);
                    return { location: 'inventory', reason: 'amulet' };
                } else {
                    game.player.junkBag.push(itemName);
                    return { location: 'junk', reason: 'duplicate amulet' };
                }
            }
            
            // Check if it's equipment (weapon, armor, shield, helmet, gloves, boots)
            const weaponItem = equipment.weapons.find(w => w.name === itemName);
            const armorItem = equipment.armor.find(a => a.name === itemName);
            const shieldItem = equipment.shields.find(s => s.name === itemName);
            const helmetItem = equipment.helmets.find(h => h.name === itemName);
            const gloveItem = equipment.gloves.find(g => g.name === itemName);
            const bootItem = equipment.boots.find(b => b.name === itemName);
            
            const equipItem = weaponItem || armorItem || shieldItem || helmetItem || gloveItem || bootItem;
            
            if (equipItem) {
                // Check class restriction
                if (equipItem.class && equipItem.class !== game.player.class) {
                    game.player.junkBag.push(itemName);
                    return { location: 'junk', reason: 'wrong class' };
                }
                
                // Check level restriction
                if (equipItem.minLevel && game.player.level < equipItem.minLevel) {
                    game.player.inventory.push(itemName);
                    return { location: 'inventory', reason: 'equipment - level too low' };
                }
                
                // Add to inventory for player to decide
                game.player.inventory.push(itemName);
                return { location: 'inventory', reason: 'equipment' };
            }
            
            // Default: add to inventory
            game.player.inventory.push(itemName);
            return { location: 'inventory', reason: 'unknown' };
        }

        // ------------------------------------------------------------
        // SECTION 58: OPEN CHEST
        // Generates and distributes loot
        // ------------------------------------------------------------
        
        function openChest() {
            const room = game.currentRoom;
            
            if (!room.hasChest) {
                speak('There is no chest here.');
                return;
            }
            
            if (room.searched) {
                speak('You have already looted this chest.');
                return;
            }
            
            room.searched = true;
            
            let loot = [];
            let messages = ['You open the chest!'];
            
            const level = game.dungeon.currentLevel;
            const playerLevel = game.player.level;
            
            // Guaranteed gold
            let goldAmount = Math.floor((20 + Math.random() * 30) * (1 + level * 0.2));
            if (game.player.specialItems.includes("Merchant's Lucky Coin")) {
                goldAmount = Math.floor(goldAmount * 1.5);
            }
            game.player.gold += goldAmount;
            messages.push(`You find ${goldAmount} gold!`);
            
            // Library rooms give ability books
            if (room.type === 'library') {
                const availableAbilities = abilities.filter(a => 
                    (!a.class || a.class === game.player.class) &&
                    (!a.minLevel || playerLevel >= a.minLevel - 2) &&
                    !game.player.learnedAbilities.includes(a.name)
                );
                
                if (availableAbilities.length > 0) {
                    const ability = availableAbilities[Math.floor(Math.random() * availableAbilities.length)];
                    const bookName = `Book of ${ability.name}`;
                    loot.push(bookName);
                    game.player.inventory.push(bookName);
                    messages.push(`You find a ${bookName}! Say read book to learn this ability.`);
                } else {
                    messages.push('The books here hold no new knowledge for you.');
                }
            }
            
            // Boss chests are extra rewarding
            if (room.type === 'boss') {
                // Always drop a good equipment piece
                const equipTypes = ['weapons', 'armor', 'helmets', 'gloves', 'boots'];
                const equipType = equipTypes[Math.floor(Math.random() * equipTypes.length)];
                const availableEquip = equipment[equipType].filter(e => 
                    (!e.class || e.class === game.player.class) &&
                    (!e.minLevel || playerLevel >= e.minLevel - 1)
                );
                
                if (availableEquip.length > 0) {
                    const item = availableEquip[Math.floor(Math.random() * availableEquip.length)];
                    const result = addItemToInventory(item.name);
                    loot.push(item.name);
                    if (result.location === 'inventory') {
                        messages.push(`You find ${item.name}! Say equip or inspect to see its stats.`);
                    } else {
                        messages.push(`You find ${item.name}, but it goes to your junk bag.`);
                    }
                }
                
                // Bonus potion
                const potions = ['Greater Health Potion', 'Greater Mana Potion', 'Supreme Health Potion'];
                const potion = potions[Math.floor(Math.random() * potions.length)];
                game.player.inventory.push(potion);
                loot.push(potion);
                messages.push(`You also find a ${potion}!`);
            }
            
            // Regular chest loot
            else {
                const lootRoll = Math.random();
                
                // 35% chance for equipment
                if (lootRoll < 0.35) {
                    const equipTypes = ['weapons', 'armor', 'shields', 'helmets', 'gloves', 'boots'];
                    const equipType = equipTypes[Math.floor(Math.random() * equipTypes.length)];
                    const availableEquip = equipment[equipType].filter(e => 
                        (!e.minLevel || playerLevel >= e.minLevel - 2)
                    );
                    
                    if (availableEquip.length > 0) {
                        const item = availableEquip[Math.floor(Math.random() * availableEquip.length)];
                        const result = addItemToInventory(item.name);
                        loot.push(item.name);
                        if (result.location === 'inventory') {
                            messages.push(`You find ${item.name}!`);
                        } else {
                            messages.push(`You find ${item.name}, sent to junk bag. ${result.reason}.`);
                        }
                    }
                }
                
                // 25% chance for ring or amulet
                else if (lootRoll < 0.60) {
                    if (Math.random() < 0.6) {
                        const availableRings = rings.filter(r => !r.minLevel || playerLevel >= r.minLevel - 2);
                        const ring = availableRings[Math.floor(Math.random() * availableRings.length)];
                        const result = addItemToInventory(ring.name);
                        loot.push(ring.name);
                        if (result.location === 'inventory') {
                            messages.push(`You find a ${ring.name}!`);
                        } else {
                            messages.push(`You find a ${ring.name}, sent to junk bag. ${result.reason}.`);
                        }
                    } else {
                        const availableAmulets = amulets.filter(a => !a.minLevel || playerLevel >= a.minLevel - 2);
                        const amulet = availableAmulets[Math.floor(Math.random() * availableAmulets.length)];
                        const result = addItemToInventory(amulet.name);
                        loot.push(amulet.name);
                        if (result.location === 'inventory') {
                            messages.push(`You find an ${amulet.name}!`);
                        } else {
                            messages.push(`You find an ${amulet.name}, sent to junk bag. ${result.reason}.`);
                        }
                    }
                }
                
                // 25% chance for potion
                else if (lootRoll < 0.85) {
                    const potionOptions = ['Health Potion', 'Mana Potion'];
                    if (level >= 5) potionOptions.push('Greater Health Potion', 'Greater Mana Potion');
                    if (level >= 10) potionOptions.push('Supreme Health Potion', 'Supreme Mana Potion');
                    
                    const potion = potionOptions[Math.floor(Math.random() * potionOptions.length)];
                    game.player.inventory.push(potion);
                    loot.push(potion);
                    messages.push(`You find a ${potion}!`);
                }
                
                // 15% chance for treasure (sell for gold)
                else {
                    const availableTreasures = treasures.filter(t => !t.minLevel || level >= t.minLevel);
                    const treasure = availableTreasures[Math.floor(Math.random() * availableTreasures.length)];
                    game.player.junkBag.push(treasure.name);
                    loot.push(treasure.name);
                    messages.push(`You find a ${treasure.name}! Sent to junk bag to sell later.`);
                }
                
                // 20% chance for bonus item
                if (Math.random() < 0.20) {
                    const bonusPotion = Math.random() < 0.5 ? 'Health Potion' : 'Mana Potion';
                    game.player.inventory.push(bonusPotion);
                    loot.push(bonusPotion);
                    messages.push(`Bonus find: a ${bonusPotion}!`);
                }
            }
            
            speakSequence(messages);
        }

        // ------------------------------------------------------------
        // SECTION 59: EQUIP ITEM
        // Equips weapons, armor, accessories
        // ------------------------------------------------------------
        
        function equipItem(itemName) {
            // Find item in inventory
            const index = game.player.inventory.indexOf(itemName);
            if (index === -1) {
                speak(`You don't have ${itemName} in your inventory.`);
                return false;
            }
            
            // Check what type of item it is
            const weaponData = equipment.weapons.find(w => w.name === itemName);
            const armorData = equipment.armor.find(a => a.name === itemName);
            const shieldData = equipment.shields.find(s => s.name === itemName);
            const helmetData = equipment.helmets.find(h => h.name === itemName);
            const gloveData = equipment.gloves.find(g => g.name === itemName);
            const bootData = equipment.boots.find(b => b.name === itemName);
            const ringData = rings.find(r => r.name === itemName);
            const braceletData = equipment.bracelets.find(b => b.name === itemName);
            const amuletData = amulets.find(a => a.name === itemName);
            
            // Check class restriction
            const itemData = weaponData || armorData || shieldData || helmetData || gloveData || bootData;
            if (itemData && itemData.class && itemData.class !== game.player.class) {
                speak(`You cannot equip ${itemName}. It is for ${itemData.class}s only.`);
                return false;
            }
            
            // Check level restriction
            if (itemData && itemData.minLevel && game.player.level < itemData.minLevel) {
                speak(`You need to be level ${itemData.minLevel} to equip ${itemName}. You are level ${game.player.level}.`);
                return false;
            }
            
            // Remove from inventory
            game.player.inventory.splice(index, 1);
            
            // Equip based on type
            if (weaponData) {
                if (game.player.weapon) {
                    game.player.junkBag.push(game.player.weapon);
                    speak(`You unequip ${game.player.weapon} and send it to your junk bag.`);
                }
                game.player.weapon = itemName;
                speak(`You equip ${itemName}. Attack power increased!`);
            }
            else if (armorData) {
                if (game.player.armor) {
                    game.player.junkBag.push(game.player.armor);
                }
                game.player.armor = itemName;
                updateDefense();
                speak(`You equip ${itemName}. Defense is now ${game.player.defense}.`);
            }
            else if (shieldData) {
                if (game.player.shield) {
                    game.player.junkBag.push(game.player.shield);
                }
                game.player.shield = itemName;
                updateDefense();
                speak(`You equip ${itemName}. Defense is now ${game.player.defense}.`);
            }
            else if (helmetData) {
                if (game.player.helmet) {
                    game.player.junkBag.push(game.player.helmet);
                }
                game.player.helmet = itemName;
                updateDefense();
                speak(`You equip ${itemName}. Defense is now ${game.player.defense}.`);
            }
            else if (gloveData) {
                if (game.player.gloves) {
                    game.player.junkBag.push(game.player.gloves);
                }
                game.player.gloves = itemName;
                updateDefense();
                speak(`You equip ${itemName}. Defense is now ${game.player.defense}.`);
            }
            else if (bootData) {
                if (game.player.boots) {
                    game.player.junkBag.push(game.player.boots);
                }
                game.player.boots = itemName;
                updateDefense();
                speak(`You equip ${itemName}. Defense is now ${game.player.defense}.`);
            }
            else if (ringData) {
                // Ring of Regeneration has no limit while equipped
                if (itemName === 'Ring of Regeneration') {
                    game.player.equippedRings.push(itemName);
                    speak(`You equip ${itemName}. You will regenerate 50 health per turn in combat!`);
                }
                // Other rings: max 10 ring slots
                else if (game.player.equippedRings.length < 10) {
                    game.player.equippedRings.push(itemName);
                    applyRingBonus(ringData);
                    speak(`You equip ${itemName}. ${ringData.effect}.`);
                } else {
                    game.player.inventory.push(itemName);
                    speak('You cannot wear more than 10 rings. Remove one first.');
                    return false;
                }
            }
            else if (braceletData) {
                if (game.player.equippedBracelets.length < 2) {
                    game.player.equippedBracelets.push(itemName);
                    speak(`You equip ${itemName}. Its power flows through you!`);
                } else {
                    game.player.inventory.push(itemName);
                    speak('You cannot wear more than 2 bracelets. Remove one first.');
                    return false;
                }
            }
            else if (amuletData) {
                if (game.player.equippedAmulet) {
                    game.player.junkBag.push(game.player.equippedAmulet);
                    speak(`You unequip ${game.player.equippedAmulet} and send it to your junk bag.`);
                }
                game.player.equippedAmulet = itemName;
                applyAmuletBonus(amuletData);
                speak(`You equip ${itemName}. ${amuletData.effect}.`);
            }
            else {
                game.player.inventory.push(itemName);
                speak(`${itemName} cannot be equipped.`);
                return false;
            }
            
            return true;
        }

        // ------------------------------------------------------------
        // SECTION 60: REMOVE EQUIPMENT
        // Unequips items
        // ------------------------------------------------------------
        
        function removeEquipment(slot) {
            switch (slot) {
                case 'weapon':
                    if (!game.player.weapon) {
                        speak('You have no weapon equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.weapon);
                    speak(`You remove ${game.player.weapon} and send it to your junk bag.`);
                    game.player.weapon = '';
                    break;
                    
                case 'armor':
                    if (!game.player.armor) {
                        speak('You have no armor equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.armor);
                    speak(`You remove ${game.player.armor} and send it to your junk bag.`);
                    game.player.armor = '';
                    updateDefense();
                    break;
                    
                case 'shield':
                    if (!game.player.shield) {
                        speak('You have no shield equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.shield);
                    speak(`You remove ${game.player.shield} and send it to your junk bag.`);
                    game.player.shield = '';
                    updateDefense();
                    break;
                    
                case 'helmet':
                    if (!game.player.helmet) {
                        speak('You have no helmet equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.helmet);
                    speak(`You remove ${game.player.helmet} and send it to your junk bag.`);
                    game.player.helmet = '';
                    updateDefense();
                    break;
                    
                case 'gloves':
                    if (!game.player.gloves) {
                        speak('You have no gloves equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.gloves);
                    speak(`You remove ${game.player.gloves} and send it to your junk bag.`);
                    game.player.gloves = '';
                    updateDefense();
                    break;
                    
                case 'boots':
                    if (!game.player.boots) {
                        speak('You have no boots equipped.');
                        return;
                    }
                    game.player.junkBag.push(game.player.boots);
                    speak(`You remove ${game.player.boots} and send it to your junk bag.`);
                    game.player.boots = '';
                    updateDefense();
                    break;
                    
                case 'amulet':
                    if (!game.player.equippedAmulet) {
                        speak('You have no amulet equipped.');
                        return;
                    }
                    removeAmuletBonus();
                    game.player.junkBag.push(game.player.equippedAmulet);
                    speak(`You remove ${game.player.equippedAmulet} and send it to your junk bag.`);
                    game.player.equippedAmulet = '';
                    break;
                    
                case 'ring':
                    if (game.player.equippedRings.length === 0) {
                        speak('You have no rings equipped.');
                        return;
                    }
                    // Remove last equipped ring
                    const removedRing = game.player.equippedRings.pop();
                    
                    // Ring of Regeneration goes to junk and CANNOT be re-equipped
                    if (removedRing === 'Ring of Regeneration') {
                        game.player.junkBag.push(removedRing);
                        speak(`You remove ${removedRing}. Warning: Once removed, Rings of Regeneration cannot be re-equipped and have been sent to your junk bag.`);
                    } else {
                        const ringData = rings.find(r => r.name === removedRing);
                        if (ringData) removeRingBonus(ringData);
                        game.player.junkBag.push(removedRing);
                        speak(`You remove ${removedRing} and send it to your junk bag.`);
                    }
                    break;
                    
                case 'bracelet':
                    if (game.player.equippedBracelets.length === 0) {
                        speak('You have no bracelets equipped.');
                        return;
                    }
                    const removedBracelet = game.player.equippedBracelets.pop();
                    game.player.junkBag.push(removedBracelet);
                    speak(`You remove ${removedBracelet} and send it to your junk bag.`);
                    break;
                    
                default:
                    speak('Say remove followed by weapon, armor, shield, helmet, gloves, boots, ring, bracelet, or amulet.');
            }
        }

        // ------------------------------------------------------------
        // SECTION 61: UPDATE DEFENSE
        // Recalculates total defense from equipment
        // ------------------------------------------------------------
        
        function updateDefense() {
            let totalDefense = 0;
            
            // Armor
            if (game.player.armor) {
                const armorData = equipment.armor.find(a => a.name === game.player.armor);
                if (armorData) totalDefense += armorData.defense;
            }
            
            // Shield
            if (game.player.shield) {
                const shieldData = equipment.shields.find(s => s.name === game.player.shield);
                if (shieldData) totalDefense += shieldData.defense;
            }
            
            // Helmet
            if (game.player.helmet) {
                const helmetData = equipment.helmets.find(h => h.name === game.player.helmet);
                if (helmetData) totalDefense += helmetData.defense;
            }
            
            // Gloves
            if (game.player.gloves) {
                const gloveData = equipment.gloves.find(g => g.name === game.player.gloves);
                if (gloveData) totalDefense += gloveData.defense;
            }
            
            // Boots
            if (game.player.boots) {
                const bootData = equipment.boots.find(b => b.name === game.player.boots);
                if (bootData) totalDefense += bootData.defense;
            }
            
            game.player.defense = totalDefense;
        }

        // ------------------------------------------------------------
        // SECTION 62: RING BONUS FUNCTIONS
        // ------------------------------------------------------------
        
        function applyRingBonus(ringData) {
            if (!ringData || !ringData.stat) return;
            
            switch (ringData.stat) {
                case 'maxHealth':
                    game.player.maxHealth += ringData.value;
                    break;
                case 'maxMana':
                    game.player.maxMana += ringData.value;
                    break;
                case 'attack':
                    game.player.baseAttack += ringData.value;
                    break;
            }
        }
        
        function removeRingBonus(ringData) {
            if (!ringData || !ringData.stat) return;
            
            switch (ringData.stat) {
                case 'maxHealth':
                    game.player.maxHealth -= ringData.value;
                    if (game.player.health > game.player.maxHealth) {
                        game.player.health = game.player.maxHealth;
                    }
                    break;
                case 'maxMana':
                    game.player.maxMana -= ringData.value;
                    if (game.player.mana > game.player.maxMana) {
                        game.player.mana = game.player.maxMana;
                    }
                    break;
                case 'attack':
                    game.player.baseAttack -= ringData.value;
                    break;
            }
        }

                speak('Your junk bag is empty.');

            }
            
            let totalValue = 0;
            for (let item of game.player.junkBag) {
                const treasure = treasures.find(t => t.name === item);
                const ring = rings.find(r => r.name === item);
                const amulet = amulets.find(a => a.name === item);
                const weapon = equipment.weapons.find(w => w.name === item);
                const armor = equipment.armor.find(a => a.name === item);
                const shield = equipment.shields.find(s => s.name === item);
                const helmet = equipment.helmets.find(h => h.name === item);
                const glove = equipment.gloves.find(g => g.name === item);
                const boot = equipment.boots.find(b => b.name === item);
                const bracelet = equipment.bracelets.find(b => b.name === item);
                
                const itemData = treasure || weapon || armor || shield || helmet || glove || boot || bracelet;
                if (itemData) {
                    totalValue += Math.floor((itemData.value || itemData.price || 0) * 0.6);
                }
                if (ring) totalValue += Math.floor(ring.price * 0.6);
                if (amulet) totalValue += Math.floor(amulet.price * 0.6);
            }
            
            let messages = [
                `Your junk bag has ${game.player.junkBag.length} items.`,
                `Total sell value: ${totalValue} gold.`,

        // ------------------------------------------------------------
        // SECTION 68: READ BOOK
        // Learns ability from book
        // ------------------------------------------------------------
        
        function readBook(bookName) {
            // Find the book in inventory
            let foundBook = null;
            let bookIndex = -1;
            
            for (let i = 0; i < game.player.inventory.length; i++) {
                const item = game.player.inventory[i];
                if (item.includes('Book of') || item.includes('Tome of') || item.includes('Scroll of')) {
                    if (bookName && item.toLowerCase().includes(bookName.toLowerCase())) {
                        foundBook = item;
                        bookIndex = i;
                        break;
                    } else if (!bookName) {
                        foundBook = item;
                        bookIndex = i;
                        break;
                    }
                }
            }
            
            if (!foundBook) {
                speak('You have no ability books to read.');
                return;
            }
            
            // Extract ability name from book
            const abilityName = foundBook.replace('Book of ', '').replace('Tome of ', '').replace('Scroll of ', '');
            
            // Check if already learned
            if (game.player.learnedAbilities.includes(abilityName)) {
                speak(`You have already learned ${abilityName}. The book crumbles to dust.`);
                game.player.inventory.splice(bookIndex, 1);
                return;
            }
            
            // Find the ability data
            const abilityData = abilities.find(a => a.name === abilityName);
            
            if (!abilityData) {
                speak('This book contains knowledge you cannot understand.');
                return;
            }
            
            // Check class restriction
            if (abilityData.class && abilityData.class !== game.player.class) {
                speak(`This ability is for ${abilityData.class}s only. You cannot learn it.`);
                return;
            }
            
            // Check level restriction
            if (abilityData.minLevel && game.player.level < abilityData.minLevel) {
                speak(`You need to be level ${abilityData.minLevel} to learn ${abilityName}. Keep the book for later.`);
                return;
            }
            
            // Learn the ability
            game.player.learnedAbilities.push(abilityName);
            game.player.inventory.splice(bookIndex, 1);
            
            speakSequence([
                `You study the ${foundBook} carefully.`,
                `You have learned ${abilityName}!`,
                `${abilityData.description}`,
                `Mana cost: ${abilityData.cost}. Say cast ${abilityName} in combat to use it!`
            ]);
        }

        // ------------------------------------------------------------
        // SECTION 69: SAVE GAME
        // V12 style named character saves
        // ------------------------------------------------------------
        
        function saveGame(saveName) {
            if (!game.player.name) {
                speak('You must create a character before saving.');
                return;
            }
            
            const name = saveName || game.player.name;
            
            try {
                const saveData = {
                    version: 'V14',
                    timestamp: Date.now(),
                    player: JSON.parse(JSON.stringify(game.player)),
                    dungeon: {
                        grid: game.dungeon.grid,
                        size: game.dungeon.size,
                        currentLevel: game.dungeon.currentLevel,
                        hasSecretRoom: game.dungeon.hasSecretRoom
                    },
                    currentRoom: game.currentRoom,
                    phase: game.phase
                };
                
                const saveKey = `echoDungeon_char_${name.toLowerCase()}`;
                localStorage.setItem(saveKey, JSON.stringify(saveData));
                
                // Update character list
                let charList = JSON.parse(localStorage.getItem('echoDungeon_characters') || '[]');
                if (!charList.includes(name.toLowerCase())) {
                    charList.push(name.toLowerCase());
                    localStorage.setItem('echoDungeon_characters', JSON.stringify(charList));
                }
                
                speak(`Game saved successfully! Character ${name} has been saved. You can load this character anytime by saying load ${name}.`);
                
            } catch (e) {
                speak('Sorry, there was an error saving your game. Please try again.');
            }
        }

        // ------------------------------------------------------------
        // SECTION 70: LOAD GAME
        // Loads a named character save
        // ------------------------------------------------------------
        
        function loadGame(characterName) {
            if (!characterName) {
                // List available characters
                listSavedCharacters();
                return;
            }
            
            try {
                const saveKey = `echoDungeon_char_${characterName.toLowerCase()}`;
                const saveDataString = localStorage.getItem(saveKey);
                
                if (!saveDataString) {
                    speak(`No saved character named ${characterName} found. Say list saves to see available characters.`);
                    return;
                }
                
                const saveData = JSON.parse(saveDataString);
                
                // Restore game state
                Object.assign(game.player, saveData.player);
                game.dungeon.grid = saveData.dungeon.grid;
                game.dungeon.size = saveData.dungeon.size;
                game.dungeon.currentLevel = saveData.dungeon.currentLevel;
                game.dungeon.hasSecretRoom = saveData.dungeon.hasSecretRoom;
                game.currentRoom = saveData.currentRoom;
                game.phase = 'exploration';
                game.started = true;
                game.initialized = true;
                game.combat = null;
                
                // Recalculate derived stats
                calculateDerivedStats();
                updateDefense();
                
                speakSequence([
                    `Welcome back, ${game.player.name}!`,
                    `You are a level ${game.player.level} ${game.player.race} ${game.player.class}.`,
                    `You are on dungeon floor ${game.dungeon.currentLevel}.`,
                    `Health: ${game.player.health} of ${game.player.maxHealth}. Mana: ${game.player.mana} of ${game.player.maxMana}. Gold: ${game.player.gold}.`,
                    `Say look around to see your surroundings, or help for commands.`
                ]);
                
            } catch (e) {
                speak('Sorry, there was an error loading your save. The save file may be corrupted.');
            }
        }

        // ------------------------------------------------------------
        // SECTION 72: DELETE SAVE
        // Removes a character save
        // ------------------------------------------------------------
        
        function deleteSave(characterName) {
            if (!characterName) {
                speak('Say delete save followed by the character name.');
                return;
            }
            
            try {
                const saveKey = `echoDungeon_char_${characterName.toLowerCase()}`;
                
                if (!localStorage.getItem(saveKey)) {
                    speak(`No saved character named ${characterName} found.`);

            }
        }

            const weapons = availableItems.filter(i => i.type === 'weapon');
